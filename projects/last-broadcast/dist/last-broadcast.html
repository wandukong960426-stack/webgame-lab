<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e11">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="폐국 두 시간 전 라디오 방송국에서 사라진 원본 릴을 두 사람이 서로 다른 자료로 추적하는 협동 추리게임.">
  <title>마지막 송출</title>
  <style>
/* 마지막 송출 — 화면 스타일
   밤의 방송국 · 퇴색한 기록물 · 낮은 조도의 장비 패널. 포인트 색은 호박(서하), 청록(이안), 송출 빨강 세 가지로 제한한다. */
:root {
  color-scheme: dark;
  --bg: #0b0e11; --bg2: #0f1418; --panel: #141a1f; --panel2: #1a2228; --panel3: #212b32;
  --line: #2a343c; --line2: #3b4851;
  --text: #ece6d8; --muted: #aab3b8; --dim: #848f96;
  --amber: #e8a63a; --amber-soft: rgba(232, 166, 58, .14); --amber-ink: #1c1306;
  --cyan: #74bccb; --cyan-soft: rgba(116, 188, 203, .14); --cyan-ink: #061518;
  --red: #e2694f; --red-soft: rgba(226, 105, 79, .14);
  --green: #6fc48d; --green-soft: rgba(111, 196, 141, .14);
  --paper: #ddd2b8; --paper2: #cfc3a6; --paper-ink: #2a251d;
  --role: var(--amber); --role-soft: var(--amber-soft); --role-ink: var(--amber-ink);
  --r: 6px;
  --sans: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Noto Serif KR", "AppleMyungjo", "Batang", "Nanum Myeongjo", Georgia, serif;
  --mono: ui-monospace, "D2Coding", "SFMono-Regular", Menlo, Consolas, monospace;
}
body[data-role="ian"] { --role: var(--cyan); --role-soft: var(--cyan-soft); --role-ink: var(--cyan-ink); }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
  font: 16px/1.65 var(--sans); letter-spacing: -0.005em; word-break: keep-all; overflow-wrap: break-word;
  background-image: radial-gradient(1200px 600px at 70% -10%, rgba(232, 166, 58, .06), transparent 60%);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--role); outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 8px; top: -60px; z-index: 50; background: var(--amber); color: var(--amber-ink); padding: 10px 14px; border-radius: var(--r); font-weight: 700; }
.skip:focus { top: 8px; }
code { font-family: var(--mono); font-size: .9em; background: var(--panel3); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
h1, h2, h3, h4 { line-height: 1.3; margin: 0 0 .5em; letter-spacing: -0.02em; }
p { margin: 0 0 .8em; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
small { font-size: .82em; color: var(--muted); font-weight: 400; }

/* ───── 버튼 ───── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 10px 18px;
  background: var(--panel2); border: 1px solid var(--line2); border-radius: var(--r); color: var(--text); font-weight: 600; line-height: 1.25; text-align: center;
  transition: background .15s, border-color .15s, transform .1s;
}
.btn:hover { border-color: var(--role); background: var(--panel3); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--role); border-color: var(--role); color: var(--role-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); border-color: var(--line2); }
.btn.small { min-height: 40px; padding: 7px 12px; font-size: .9rem; }
.btn.big { min-height: 54px; padding: 14px 24px; font-size: 1.05rem; }
.btn.icon { width: 44px; padding: 0; font-size: 1.15rem; }
.btn.warn { border-color: rgba(226, 105, 79, .6); }
.btn.primary.warn { background: var(--red); border-color: var(--red); color: #1d0905; }
.btn.done { border-color: rgba(111, 196, 141, .55); color: var(--green); }
.btn .sub { display: block; font-size: .78rem; font-weight: 500; opacity: .8; }
.chip-btn {
  display: inline-flex; align-items: center; min-height: 36px; padding: 5px 12px; margin: 2px 4px 2px 0;
  background: var(--panel2); border: 1px solid var(--line2); border-radius: 999px; font-size: .86rem; color: var(--text); text-align: left;
}
.chip-btn.on { background: var(--role-soft); border-color: var(--role); color: var(--text); }
.chip-btn:hover { border-color: var(--role); }

/* ───── 타이틀 ───── */
.title-screen { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: center; gap: 24px; max-width: 1240px; margin: 0 auto; padding: 32px 32px 48px; }
.title-art { position: relative; aspect-ratio: 4 / 3; border-radius: 10px; overflow: hidden; box-shadow: 0 30px 80px rgba(0, 0, 0, .6); }
.title-art .art { width: 100%; height: 100%; display: block; }
.eyebrow { color: var(--amber); font-size: .78rem; letter-spacing: .22em; font-weight: 700; margin-bottom: .6em; }
.title-screen h1.game-title { font-family: var(--serif); font-weight: 500; font-size: clamp(3rem, 7.5vw, 5.8rem); letter-spacing: -0.04em; line-height: 1.02; margin: 0 0 .25em; }
.game-title:focus { outline: none; }
.tagline { font-family: var(--serif); font-size: clamp(1.1rem, 2.2vw, 1.4rem); color: var(--text); margin-bottom: 1em; }
.blurb { color: var(--muted); max-width: 34em; }
.chips { list-style: none; padding: 0; margin: 18px 0; display: flex; flex-wrap: wrap; gap: 8px; }
.chips li { font-size: .8rem; border: 1px solid var(--line2); border-radius: 999px; padding: 4px 11px; color: var(--muted); }
.title-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 22px 0 18px; }
.title-actions .btn.primary { min-width: 180px; flex-direction: column; }
.fineprint { font-size: .8rem; color: var(--dim); margin-top: 18px; }
.switch { display: flex; align-items: center; gap: 12px; min-height: 44px; cursor: pointer; }
.switch input[type=checkbox] { appearance: none; -webkit-appearance: none; flex: none; width: 46px; height: 26px; margin: 0; border-radius: 999px; background: var(--panel3); border: 1px solid var(--line2); position: relative; cursor: pointer; transition: background .15s; }
.switch input[type=checkbox]::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
.switch input[type=checkbox]:checked { background: var(--role-soft); border-color: var(--role); }
.switch input[type=checkbox]:checked::after { transform: translateX(20px); background: var(--role); }
.switch input[type=checkbox]:disabled { opacity: .45; cursor: not-allowed; }
.switch span { display: flex; flex-direction: column; line-height: 1.35; }

/* ───── 장면 ───── */
.scene { min-height: 100vh; display: grid; grid-template-rows: minmax(220px, 52vh) auto; background: #07090b; }
.scene-art { position: relative; overflow: hidden; }
.scene-art .art { position: absolute; inset: 0; width: 100%; height: 100%; }
.scene-art::after { content: ""; position: absolute; inset: auto 0 0 0; height: 40%; background: linear-gradient(transparent, #07090b); }
.scene-panel { width: min(820px, 100%); margin: -64px auto 0; position: relative; padding: 0 20px 40px; }
.scene-head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; margin-bottom: 14px; }
.scene-time { font-family: var(--mono); font-size: 1.6rem; color: var(--amber); letter-spacing: .04em; }
.scene-place { color: var(--muted); font-size: .95rem; }
.scene-count { margin-left: auto; color: var(--dim); font-size: .8rem; font-family: var(--mono); }
.lines { list-style: none; margin: 0 0 18px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.line { animation: rise .35s ease both; }
.line.narr { color: var(--muted); font-family: var(--serif); font-size: 1.05rem; }
.line.radio { font-family: var(--serif); font-size: 1.12rem; color: #f1dfc0; padding-left: 14px; border-left: 3px solid var(--red); }
.line.radio .who { display: block; font-family: var(--sans); font-size: .72rem; letter-spacing: .14em; color: var(--red); }
.line.say { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: baseline; }
.line.say .who { font-size: .82rem; font-weight: 700; color: var(--dim); }
.line.say.seoha .who { color: var(--amber); }
.line.say.ian .who { color: var(--cyan); }
.line.say .said { font-size: 1.06rem; }
.after { color: var(--amber); font-style: italic; font-size: .95rem; }
.scene-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.scene-actions.choice { flex-direction: column; align-items: stretch; }
.scene-actions.choice .btn { justify-content: flex-start; text-align: left; }
.scene-foot { display: flex; align-items: center; gap: 12px; margin-top: 18px; color: var(--dim); font-size: .8rem; }
.kbd-hint { margin-left: auto; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ───── 역할 선택 ───── */
.pick { max-width: 860px; margin: 0 auto; padding: 56px 20px; }
.pick h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(1.8rem, 4vw, 2.6rem); }
.lead { font-size: 1.05rem; color: var(--muted); }
.pick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 26px 0; }
.pick-card { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; text-align: left; padding: 20px; background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; }
.pick-card .portrait { grid-row: span 3; border-radius: 8px; }
.pick-card.seoha:hover, .pick-card.seoha:focus-visible { border-color: var(--amber); }
.pick-card.ian:hover, .pick-card.ian:focus-visible { border-color: var(--cyan); }
.pick-name { font-size: 1.3rem; font-weight: 700; }
.pick-desc { color: var(--muted); font-size: .92rem; }
.pick-go { font-weight: 700; color: var(--amber); }
.pick-card.ian .pick-go { color: var(--cyan); }

/* ───── 상단 ───── */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: rgba(11, 14, 17, .94); border-bottom: 1px solid var(--line); backdrop-filter: blur(8px); }
.brand { background: none; border: 0; font-family: var(--serif); font-size: 1.15rem; font-weight: 600; padding: 8px 4px; min-height: 44px; white-space: nowrap; }
.act-chip { font-size: .85rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.act-chip span { color: var(--role); font-weight: 700; margin-right: 4px; }
.role-chip { display: flex; align-items: center; gap: 8px; padding: 3px 12px 3px 3px; border: 1px solid var(--role); border-radius: 999px; background: var(--role-soft); margin-left: auto; }
.role-chip .portrait { border-radius: 50%; }
.role-chip span { display: flex; flex-direction: column; line-height: 1.15; font-weight: 700; font-size: .92rem; }
.role-chip small { font-size: .72rem; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.sw-short { display: none; }
.timer { font-family: var(--mono); font-size: .86rem; color: var(--muted); padding: 0 6px; }
.objective { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: linear-gradient(90deg, var(--role-soft), transparent 70%); border-bottom: 1px solid var(--line); }
.obj-text { flex: 1; min-width: 0; font-weight: 600; }
.obj-label { display: inline-block; font-size: .72rem; letter-spacing: .14em; color: var(--role); margin-right: 10px; font-weight: 700; }
.obj-guide { display: block; font-weight: 400; color: var(--muted); font-size: .88rem; }
.hint-dots { letter-spacing: 2px; font-size: .7rem; color: var(--role); }

/* ───── 레이아웃 ───── */
.layout { display: grid; grid-template-columns: 196px minmax(0, 1fr) 248px; gap: 0; max-width: 1440px; margin: 0 auto; min-height: calc(100vh - 120px); }
.nav { border-right: 1px solid var(--line); padding: 16px 10px; }
.nav ul { list-style: none; margin: 0; padding: 0; position: sticky; top: 140px; display: flex; flex-direction: column; gap: 4px; }
.nav button { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 8px 12px; background: none; border: 1px solid transparent; border-radius: var(--r); color: var(--muted); font-weight: 600; text-align: left; position: relative; }
.nav button:hover { color: var(--text); background: var(--panel); }
.nav button.on { color: var(--text); background: var(--role-soft); border-color: var(--role); }
.ni { width: 22px; text-align: center; font-size: 1.05rem; }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; margin-left: auto; border-radius: 999px; background: var(--red); color: #1d0905; font-size: .74rem; font-weight: 800; }
.badge.dot { min-width: 10px; width: 10px; height: 10px; padding: 0; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--red); margin-left: 6px; vertical-align: middle; }
.stage { padding: 22px 28px 60px; min-width: 0; outline: none; }
.rail { border-left: 1px solid var(--line); padding: 18px 16px; }
.checklist { position: sticky; top: 140px; }
.checklist h2 { font-size: .8rem; letter-spacing: .16em; color: var(--muted); }
.checklist ol { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.checklist li { display: flex; gap: 10px; font-size: .9rem; line-height: 1.4; }
.checklist .ck { flex: none; width: 20px; height: 20px; border: 1.5px solid var(--line2); border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; font-size: .75rem; color: var(--role-ink); }
.checklist li.done { color: var(--dim); text-decoration: line-through; text-decoration-color: var(--line2); }
.checklist li.done .ck { background: var(--role); border-color: var(--role); }
.acts { display: flex; gap: 6px; margin-bottom: 14px; }
.acts span { width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid var(--line2); font-size: .8rem; color: var(--dim); }
.acts .past { background: var(--panel3); color: var(--muted); }
.acts .now { border-color: var(--role); color: var(--role); font-weight: 800; }
.partner-note { font-size: .8rem; color: var(--dim); }
.solo-banner { font-size: .84rem; color: var(--muted); border: 1px dashed var(--line2); border-radius: var(--r); padding: 8px 12px; margin-bottom: 16px; }

.view-title { font-size: 1.5rem; font-weight: 700; margin-top: 4px; }
.view-title:focus { outline: none; }
.view-sub { color: var(--muted); font-size: .94rem; max-width: 46em; }
.tabs, .subtabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
.tabs button, .subtabs button { min-height: 44px; padding: 8px 14px; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted); font-weight: 600; margin-bottom: -1px; }
.tabs button.on, .subtabs button.on { color: var(--text); border-bottom-color: var(--role); }
.subtabs { border-bottom: 0; gap: 6px; margin: 14px 0; }
.subtabs button { border: 1px solid var(--line2); border-radius: 999px; min-height: 38px; padding: 5px 14px; }
.subtabs button.on { background: var(--role-soft); border-color: var(--role); }
.crumb { display: flex; align-items: center; gap: 10px; color: var(--dim); font-size: .85rem; margin-bottom: 6px; }
.tool-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0; }
.joint-btn { border-color: var(--role); background: var(--role-soft); }
.jb-tag { font-size: .7rem; letter-spacing: .1em; color: var(--role); border: 1px solid var(--role); border-radius: 4px; padding: 1px 6px; }

/* ───── 평면도 ───── */
.blueprint { display: flex; flex-direction: column; gap: 14px; padding: 18px; background: #0d1820; border: 1px solid #23394a; border-radius: 10px;
  background-image: linear-gradient(rgba(116, 188, 203, .06) 1px, transparent 1px), linear-gradient(90deg, rgba(116, 188, 203, .06) 1px, transparent 1px); background-size: 20px 20px; }
.floor { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 10px; align-items: stretch; }
.floor-label { margin: 0; font-size: .8rem; font-family: var(--mono); color: #8fb9c7; letter-spacing: .08em; display: flex; align-items: center; justify-content: center; border-right: 1px dashed #2a4556; }
.floor-grid { display: grid; gap: 6px; }
.cell { border-radius: 4px; padding: 8px; display: flex; flex-direction: column; justify-content: center; min-height: 64px; font-size: .8rem; line-height: 1.3; }
.cell.static { border: 1px dashed #2a4556; color: #6f8f9c; background: rgba(10, 20, 28, .6); }
.cell.static.partner { border-style: solid; border-color: rgba(116, 188, 203, .45); color: var(--cyan); }
.cell.static.outside { border-color: transparent; background: none; }
.room { text-align: left; background: #132430; border: 1.5px solid #3c6276; color: #e3eef2; position: relative; }
.room:hover { border-color: var(--amber); background: #1a2f3d; }
.room .rn { font-weight: 700; font-size: .92rem; }
.room .rs { font-size: .74rem; color: #9cc0cd; margin-top: 2px; }
.room.fresh { border-color: var(--amber); box-shadow: inset 0 0 0 1px rgba(232, 166, 58, .25); }
.room.fresh .rs { color: var(--amber); font-weight: 700; }
.room.cleared .rs { color: var(--green); }
.room.locked { background: rgba(10, 20, 28, .7); border-style: dashed; border-color: #2a4556; color: #6f8f9c; }
.room.locked .rs { color: #6f8f9c; }

/* ───── 장소 장면 ───── */
.scene-view { position: relative; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; border: 1px solid var(--line2); background: #000; margin: 12px 0 16px; }
.scene-view .scene-art { position: absolute; inset: 0; }
.scene-view .scene-art::after { display: none; }
.pin { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 6px; padding: 0; background: none; border: 0; z-index: 2; }
.pin .pn { width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--amber); color: var(--amber-ink); font-weight: 800; box-shadow: 0 0 0 4px rgba(232, 166, 58, .25), 0 4px 12px rgba(0, 0, 0, .6); animation: pulse 2.4s ease-in-out infinite; }
.pin.seen .pn { background: #2d363c; color: var(--muted); box-shadow: 0 0 0 2px var(--line2); animation: none; }
.pin .pl { background: rgba(8, 10, 12, .88); border: 1px solid var(--line2); padding: 3px 8px; border-radius: 4px; font-size: .78rem; white-space: nowrap; }
.pin:focus-visible .pn { outline: 3px solid #fff; outline-offset: 2px; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 4px rgba(232, 166, 58, .25), 0 4px 12px rgba(0, 0, 0, .6); } 50% { box-shadow: 0 0 0 9px rgba(232, 166, 58, .08), 0 4px 12px rgba(0, 0, 0, .6); } }
.spots { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
.spot { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; min-height: 56px; text-align: left; background: var(--panel); border: 1px solid var(--line2); border-radius: var(--r); }
.spot:hover { border-color: var(--amber); }
.spot .pn { flex: none; width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--amber); color: var(--amber-ink); font-weight: 800; font-size: .85rem; }
.spot.seen .pn { background: #2d363c; color: var(--muted); }
.spot .sl { flex: 1; display: flex; flex-direction: column; font-weight: 600; }
.spot .sl small { font-weight: 400; }
.spot.locked { opacity: .7; border-style: dashed; cursor: default; }
.spot.locked .pn { background: transparent; border: 1px dashed var(--line2); color: var(--dim); }

/* ───── 인터뷰 ───── */
.people { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.person-card { width: 100%; display: flex; gap: 16px; padding: 14px; text-align: left; background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; }
.person-card:hover { border-color: var(--amber); }
.portrait { border-radius: 6px; flex: none; display: block; }
.pc-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.pc-name { font-size: 1.1rem; font-weight: 700; }
.pc-bio { color: var(--muted); font-size: .9rem; }
.pc-status { font-size: .85rem; color: var(--amber); display: flex; align-items: center; gap: 6px; }
.pc-status .badge { margin-left: 0; }
.pc-role { color: var(--amber); font-weight: 600; margin-bottom: .3em; }
.person-head { display: flex; gap: 18px; align-items: flex-start; margin-bottom: 18px; }
.ask h3, .transcript h3 { font-size: .82rem; letter-spacing: .14em; color: var(--muted); }
.topics { list-style: none; margin: 0 0 22px; padding: 0; display: grid; gap: 8px; }
.topic { width: 100%; text-align: left; padding: 12px 16px; min-height: 50px; background: var(--amber-soft); border: 1px solid var(--amber); border-radius: var(--r); font-weight: 600; }
.topic::before { content: "Q. "; color: var(--amber); font-weight: 800; }
.qalog { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.qa { padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); outline: none; }
.qa.flash { animation: flash 1.2s ease; }
@keyframes flash { from { border-color: var(--amber); background: var(--amber-soft); } }
.qa .q { color: var(--amber); font-weight: 600; }
.qa .a { margin-bottom: .4em; }
.qa .who, .testimony .who { font-size: .76rem; font-weight: 700; color: var(--dim); margin-right: 8px; }
.obs { font-family: var(--serif); font-style: italic; color: #d9c79f; border-left: 2px solid var(--amber); padding-left: 10px; }
.got { font-size: .88rem; color: var(--muted); }

/* ───── 장비 기록 (터미널) ───── */
.term { background: #070b0d; border: 1px solid #23313a; border-radius: 8px; padding: 14px; font-family: var(--mono); font-size: .86rem; color: #f0c98a; box-shadow: inset 0 0 40px rgba(232, 166, 58, .04); }
body[data-role="ian"] .term { color: #a9e1ec; box-shadow: inset 0 0 40px rgba(116, 188, 203, .05); }
.term-head { color: var(--dim); font-size: .76rem; letter-spacing: .08em; margin-bottom: 8px; text-transform: uppercase; }
.term-note { color: var(--muted); font-size: .8rem; margin: 10px 0 0; font-family: var(--sans); }
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.log { width: 100%; border-collapse: collapse; }
table.log th, table.log td { padding: 7px 10px; border-bottom: 1px solid #1a252c; text-align: left; vertical-align: top; }
table.log thead th { color: var(--dim); font-weight: 600; font-size: .76rem; border-bottom: 1px solid #2a3a44; white-space: nowrap; }
table.log tbody th { font-weight: 700; white-space: nowrap; color: var(--text); }
table.log tbody tr:hover { background: rgba(255, 255, 255, .03); }
.term .log td { overflow-wrap: anywhere; }

/* ───── 센서 ───── */
.loggers { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.logger { background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; padding: 10px; }
.logger svg { width: 100%; height: auto; display: block; border-radius: 4px; }
.lg-head { display: flex; justify-content: space-between; gap: 8px; font-family: var(--mono); margin-bottom: 6px; }
.lg-head span { color: var(--dim); font-family: var(--sans); font-size: .82rem; }
.lg-key { display: flex; gap: 14px; font-size: .76rem; margin: 6px 0 2px; }
.lg-key .h { color: var(--cyan); } .lg-key .t { color: var(--amber); }
.lg-ev { font-size: .8rem; color: var(--muted); margin: 0; font-family: var(--mono); }

/* ───── 음원 ───── */
.audio-grid { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 16px; }
.files { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.file { width: 100%; text-align: left; padding: 10px 12px; min-height: 54px; background: var(--panel); border: 1px solid var(--line2); border-radius: var(--r); display: flex; flex-direction: column; }
.file.on { border-color: var(--cyan); background: var(--cyan-soft); }
.fn { font-family: var(--mono); font-size: .84rem; overflow-wrap: anywhere; }
.fd { font-size: .76rem; color: var(--muted); }
.player { background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; padding: 14px; min-width: 0; }
.player-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; margin-bottom: 8px; font-family: var(--mono); }
.player-head span { color: var(--muted); font-family: var(--sans); font-size: .85rem; }
.wave svg { width: 100%; height: 110px; display: block; border-radius: 4px; border: 1px solid #1d2a32; }
.wave.compact svg { height: 70px; }
.wave-legend { display: flex; gap: 12px; font-size: .74rem; color: var(--muted); margin: 4px 0 8px; }
.lg.clank { color: var(--amber); } .lg.cough { color: var(--red); } .lg.page { color: var(--cyan); }
.transport { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 6px 0 10px; }
.ptime { font-family: var(--mono); color: var(--cyan); font-size: .9rem; margin-left: 4px; }
.script { list-style: none; margin: 0; padding: 0; max-height: 320px; overflow-y: auto; border-top: 1px solid var(--line); }
.script li { display: grid; grid-template-columns: 96px 1fr; gap: 10px; align-items: baseline; padding: 4px 0; border-bottom: 1px solid #192228; }
.script li.mark span { color: var(--amber); font-size: .9rem; }
.script li.now { background: var(--cyan-soft); }
.ts { background: none; border: 0; color: var(--cyan); font-family: var(--mono); font-size: .82rem; text-align: left; padding: 6px 4px; min-height: 36px; display: flex; flex-direction: column; line-height: 1.2; }
.ts small { color: var(--dim); font-size: .72rem; }
.compare { margin-top: 26px; background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; padding: 14px; }
.cmp-stage { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; }
.cmp-stage .wave-legend { display: none; }
.cmp-nudge { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.cmp-match { font-family: var(--mono); }
.ok-line { color: var(--green); font-weight: 700; }
.ok-line.big { font-size: 1.3rem; }
.field { display: flex; flex-direction: column; gap: 6px; margin: 0 0 14px; font-weight: 600; font-size: .92rem; border: 0; padding: 0; min-width: 0; }
.field legend { padding: 0; margin-bottom: 6px; }
.field.inline { flex-direction: row; align-items: center; flex-wrap: wrap; gap: 10px; }
.field.small { font-size: .82rem; margin: 8px 0 0; }
.field.slider input { width: 100%; }
input:not([type=checkbox]):not([type=radio]):not([type=range]), select, textarea {
  min-height: 44px; padding: 9px 12px; background: #0a0f12; border: 1px solid var(--line2); border-radius: var(--r); color: var(--text); max-width: 100%; font-weight: 400;
}
select { padding-right: 32px; }
input[type=range] { accent-color: var(--role); min-height: 36px; }
input[type=checkbox], input[type=radio] { accent-color: var(--role); width: 20px; height: 20px; flex: none; margin: 0; }
.radios, .checks { display: flex; flex-direction: column; gap: 6px; }
.radios.row { flex-direction: row; flex-wrap: wrap; }
.radio, .check { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 12px; background: var(--panel2); border: 1px solid var(--line2); border-radius: var(--r); font-weight: 500; cursor: pointer; }
.radio:has(input:checked), .check:has(input:checked) { border-color: var(--role); background: var(--role-soft); }

/* ───── 수신함 ───── */
.docs { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.doc-row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 58px; text-align: left; background: var(--panel); border: 1px solid var(--line2); border-radius: var(--r); }
.doc-row:hover { border-color: var(--role); }
.doc-row.fresh { border-left: 3px solid var(--red); }
.ti { font-size: 1.2rem; width: 26px; text-align: center; color: var(--role); }
.dr-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.dr-title { font-weight: 700; }
.dr-short { color: var(--muted); font-size: .86rem; }
.new { font-size: .7rem; font-weight: 800; color: #1d0905; background: var(--red); border-radius: 4px; padding: 1px 6px; vertical-align: middle; }
.registry { margin-top: 24px; }
.registry h3 { font-size: .82rem; letter-spacing: .14em; color: var(--muted); }
.reg-form { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.reg-form .field { flex: 1; min-width: 200px; margin: 0; }

/* ───── 증거함 ───── */
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 16px; }
.ev-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.ev-card { width: 100%; height: 100%; display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; text-align: left; background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; position: relative; min-height: 116px; }
.ev-card:hover { border-color: var(--role); }
.ev-card.unread { border-left: 3px solid var(--red); }
.ev-type { font-size: .74rem; color: var(--role); font-weight: 700; letter-spacing: .04em; }
.ev-title { font-weight: 700; line-height: 1.35; }
.ev-short { font-size: .84rem; color: var(--muted); line-height: 1.45; }
.ev-card .new, .ev-card .read { position: absolute; top: 10px; right: 10px; }
.ev-card .read { font-size: .7rem; color: var(--dim); }
.ev-card.t-paper { background-image: linear-gradient(135deg, rgba(221, 210, 184, .05), transparent 50%); }

/* ───── 시간표 ───── */
.tl-controls { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: space-between; margin: 8px 0; }
.ruler { background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; padding: 6px; margin: 10px 0; overflow-x: auto; }
.ruler svg { width: 100%; height: auto; display: block; }
.tl-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .78rem; color: var(--muted); margin-bottom: 10px; }
.tl-legend .k::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.k.std::before { background: var(--amber); } .k.dvr::before { background: #7d8a92; } .k.corr::before { background: var(--green); } .k.shared::before { background: var(--text); }
.timeline { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--line2); margin-left: 6px; }
.tl { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 12px; padding: 7px 0 7px 16px; position: relative; }
.tl::before { content: ""; position: absolute; left: -7px; top: 15px; width: 12px; height: 12px; border-radius: 50%; background: var(--amber); border: 2px solid var(--bg); }
.tl.dvr::before { background: #7d8a92; } .tl.corr::before { background: var(--green); } .tl.shared::before { background: var(--text); }
.tl-time { font-family: var(--mono); font-size: .9rem; display: flex; flex-direction: column; line-height: 1.3; }
.tl.dvr .tl-time { color: #9aa6ad; } .tl.corr .tl-time { color: var(--green); }
.tl-time small { font-size: .72rem; color: var(--dim); }
.tl-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tl-label { font-weight: 600; }
.tl-src { background: none; border: 0; padding: 6px 0; text-align: left; color: var(--muted); font-size: .8rem; text-decoration: underline; text-decoration-color: var(--line2); text-underline-offset: 3px; min-height: 36px; align-self: flex-start; }
button.tl-src:hover { color: var(--text); }
.timeline.compact .tl { padding: 4px 0 4px 16px; }

/* ───── 노트 ───── */
.notes { width: 100%; min-height: 52vh; resize: vertical; font-family: var(--serif); font-size: 1.02rem; line-height: 1.8; background: #0d1215 !important;
  background-image: repeating-linear-gradient(transparent, transparent 31px, rgba(232, 166, 58, .08) 32px) !important; padding: 14px 16px !important; }

/* ───── 사건 보드 ───── */
.board-sec { margin: 24px 0; }
.board-sec > h3 { font-size: .82rem; letter-spacing: .14em; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.joints { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.joint { background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; padding: 12px 14px; }
.joint.open { border-color: var(--role); }
.joint.done { border-color: rgba(111, 196, 141, .4); }
.joint.wait { opacity: .7; }
.jh { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.jt { font-weight: 700; }
.js { font-size: .74rem; color: var(--role); white-space: nowrap; }
.joint.done .js { color: var(--green); }
.jw { font-size: .78rem; color: var(--dim); margin-bottom: .5em; }
.joint p { font-size: .9rem; }
.fact { color: #e6ddc8; font-family: var(--serif); }
.facts { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 8px; font-family: var(--serif); color: #e6ddc8; }
.concl { background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
.concl.open { border-color: var(--role); box-shadow: 0 0 0 1px var(--role-soft); }
.concl.done { border-color: rgba(111, 196, 141, .4); }
.concl.locked { opacity: .75; }
.ch { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 10px; }
.ch h4 { margin: 0; font-size: 1.05rem; }
.cs { font-size: .78rem; color: var(--muted); }
.concl-sum { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.concl-sum li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; font-size: .9rem; border-bottom: 1px dashed var(--line); padding-bottom: 6px; }
.concl-sum span { color: var(--muted); }
.fb { font-size: .88rem; margin: 4px 0 0; font-weight: 600; outline: none; }
.fb.ok { color: var(--green); } .fb.bad { color: #f0907b; }
#jointMsg p, #shelfMsg, #matchMsg { color: #f0907b; font-weight: 600; }
.final-form .sentences { margin: 0 0 16px; padding: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 12px; }
.sentence { position: relative; padding: 14px 14px 12px 46px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; counter-increment: s; }
.sentence::before { content: counter(s); position: absolute; left: 14px; top: 14px; width: 22px; height: 22px; border-radius: 50%; background: var(--panel3); display: inline-flex; align-items: center; justify-content: center; font-size: .78rem; font-weight: 800; color: var(--muted); }
.sentence.ok { border-color: rgba(111, 196, 141, .5); } .sentence.bad { border-color: rgba(226, 105, 79, .6); }
.sentence p { margin: 0; line-height: 2.4; font-family: var(--serif); font-size: 1.02rem; }
.sentence .cat { font-size: .7rem; letter-spacing: .1em; color: var(--role); font-weight: 700; }
.blank { font-family: var(--sans); font-size: .9rem; min-height: 40px !important; padding: 5px 30px 5px 10px !important; border-color: var(--role) !important; background: var(--role-soft) !important; max-width: 100%; }
.blank.ev { border-style: dashed !important; }
.suspects { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.suspect { display: flex; gap: 14px; padding: 12px; background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; }
.suspect.s-suspect { border-color: rgba(226, 105, 79, .55); }
.suspect.s-cleared { border-color: rgba(111, 196, 141, .4); }
.su-body { flex: 1; min-width: 0; }
.su-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; margin-bottom: 8px; }
.stamp { font-size: .72rem; font-weight: 800; padding: 2px 8px; border-radius: 4px; border: 1.5px solid; transform: rotate(-2deg); }
.stamp.cleared { color: var(--green); } .stamp.culprit { color: var(--red); }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: var(--r); overflow: hidden; }
.seg button { min-height: 38px; min-width: 56px; padding: 4px 12px; background: var(--panel2); border: 0; border-right: 1px solid var(--line2); color: var(--muted); font-weight: 600; font-size: .86rem; }
.seg button:last-child { border-right: 0; }
.seg button.on.suspect { background: var(--red-soft); color: #f2a08c; }
.seg button.on.open { background: var(--panel3); color: var(--text); }
.seg button.on.cleared { background: var(--green-soft); color: var(--green); }
.links { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.links li { display: flex; align-items: center; gap: 8px; font-size: .8rem; flex-wrap: wrap; }
.links li span { color: var(--dim); min-width: 62px; }
.links li.for span { color: #f2a08c; } .links li.against span { color: var(--green); }
.log-hist { margin-top: 10px; font-size: .86rem; color: var(--muted); }
.log-hist summary { cursor: pointer; min-height: 40px; display: flex; align-items: center; }

/* ───── 모달 ───── */
dialog { padding: 0; border: 0; background: transparent; color: var(--text); max-width: none; max-height: none; }
dialog::backdrop { background: rgba(3, 5, 7, .78); backdrop-filter: blur(2px); }
.modal { width: min(760px, calc(100% - 20px)); max-height: calc(100vh - 24px); margin: auto; }
.modal.wide { width: min(980px, calc(100% - 20px)); }
.modal.full { width: calc(100% - 12px); max-height: calc(100vh - 12px); }
.modal-inner { display: flex; flex-direction: column; max-height: calc(100vh - 24px); background: var(--panel); border: 1px solid var(--line2); border-radius: 12px; box-shadow: 0 30px 80px rgba(0, 0, 0, .7); overflow: hidden; }
.modal-inner.small { padding: 22px; max-width: 460px; margin: auto; }
.modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 14px 16px 10px 20px; border-bottom: 1px solid var(--line); }
.modal-head h2 { font-size: 1.15rem; margin: 4px 0 2px; }
.modal-sub { font-size: .8rem; color: var(--muted); margin: 0; }
.modal-body { padding: 16px 20px; overflow-y: auto; overscroll-behavior: contain; }
.modal-foot { padding: 12px 20px 14px; border-top: 1px solid var(--line); background: var(--bg2); }
.modal-foot > .btn { float: right; }
.foot-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.foot-actions.wrap { justify-content: flex-start; }
.modal-foot .muted.small { margin: 8px 0 0; clear: both; }
.type-badge { font-weight: 700; color: var(--role); }
.monologue { font-family: var(--serif); font-style: italic; color: #e2d3ae; border-left: 3px solid var(--amber); padding: 2px 0 2px 12px; }
.ev-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.ev-tabs button { min-height: 38px; padding: 5px 12px; border: 1px solid var(--line2); border-radius: 999px; background: var(--panel2); font-size: .85rem; }
.ev-tabs button.on { border-color: var(--role); background: var(--role-soft); }
.ev-art { border-radius: 8px; overflow: hidden; border: 1px solid var(--line2); background: #000; }
.ev-art .art { width: 100%; height: auto; display: block; aspect-ratio: 16 / 9; }
.ev-art .art.art-obj { aspect-ratio: 400 / 260; }
.ev-art .art.cctv { aspect-ratio: 16 / 9; }
.zoomable.zoomed { overflow: auto; max-height: 70vh; }
.zoomable.zoomed .art { width: 200%; max-width: none; }
.object { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.facts-list { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
.photo { margin: 0; }
.photo figcaption { margin-top: 10px; color: var(--muted); }
.exif { display: block; font-family: var(--mono); font-size: .8rem; color: var(--amber); }
.link-ui { margin-bottom: 10px; }
.link-ui summary { cursor: pointer; font-weight: 600; min-height: 40px; display: flex; align-items: center; color: var(--muted); }
.link-grid { display: flex; flex-direction: column; gap: 6px; padding: 6px 0; }
.link-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.link-row > span { min-width: 56px; font-weight: 600; font-size: .86rem; }
.hints { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.hints li { padding: 12px 14px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; }
.hints li.shown { border-color: var(--role); }
.hints .hn { display: block; font-size: .74rem; letter-spacing: .1em; color: var(--role); font-weight: 700; margin-bottom: 4px; }
.hints li p { margin: 0; }
.howto h3 { font-size: .95rem; color: var(--role); margin-top: 1.2em; }
.howto ul { padding-left: 1.2em; }
.modes { display: grid; gap: 10px; }
.mode-card { display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 18px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 10px; color: var(--muted); position: relative; }
.mode-card:hover, .mode-card:focus-visible { border-color: var(--amber); }
.mc-title { font-weight: 800; font-size: 1.1rem; color: var(--text); }
.mc-tag { position: absolute; top: 16px; right: 16px; font-size: .72rem; font-weight: 800; color: var(--amber-ink); background: var(--amber); padding: 2px 8px; border-radius: 4px; }
.settings { display: flex; flex-direction: column; gap: 8px; }
.issues { padding-left: 1.2em; color: var(--muted); font-size: .9rem; }

/* 역할 넘기기 */
#handoff { width: 100%; height: 100%; max-width: 100%; max-height: 100%; margin: 0; background: #06080a; }
#handoff::backdrop { background: #06080a; }
.handoff-inner { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; padding: 40px 20px; max-width: 560px; margin: 0 auto; }
.handoff-inner .portrait { border-radius: 50%; border: 3px solid var(--amber); }
.handoff-inner.ian .portrait { border-color: var(--cyan); }
.handoff-inner h2 { font-family: var(--serif); font-weight: 500; font-size: clamp(1.6rem, 5vw, 2.3rem); }

    if (id === 'FINAL') {
      // 첨부한 증거는 실제로 확보한 것이어야 한다
      results.forEach(function (r, i) {
        var s = c.sentences[i], evf = s.fields.filter(function (f) { return f.evidence; })[0];
        var val = evf && (input[s.id] || {})[evf.id];
        if (r.ok && evf && !hasFound(state, val)) { r.ok = false; r.msg = c.feedback.ev; }
      });
    }
    var ok = results.every(function (r) { return r.ok; });
    var rec = state.shared.concl[id] || (state.shared.concl[id] = { done: false, tries: 0 });
    rec.tries = Math.min(999, (rec.tries || 0) + 1);
    rec.last = util.clone(input);
    if (ok) {
      rec.done = true; rec.at = Date.now();
      if (id === 'IC1') queueScene(state, 'act2');

  }

  /* ───────── 공유 사실·타임라인 ───────── */
  function factsUnlocked(state) {
    var out = [];
    ['J1', 'J2'].forEach(function (j) { if (jointDone(state, j)) out.push(JOINT[j].fact); });
    if (conclDone(state, 'IC1')) out.push('F_ic1');
    ['J3', 'MATCH'].forEach(function (j) { if (jointDone(state, j)) out.push(JOINT[j].fact); });
    if (conclDone(state, 'IC2')) out.push('F_ic2');
    ['J4', 'J5', 'J6'].forEach(function (j) { if (jointDone(state, j)) out.push(JOINT[j].fact); });
    return out;
  }
  function cctvOffset(state) { return jointDone(state, 'J1') ? JOINT.J1.offsetSec : null; }
  function timeline(state, role, corrected) {
    var r = state.roles[role], items = [];
    var off = cctvOffset(state);
    Object.keys(r.found).forEach(function (id) {
      var ev = EV[id];
      (ev.times || []).forEach(function (tm) {
        items.push({ sec: util.toSec(tm.t), t: tm.t, label: tm.label, clock: tm.clock, ev: id });
      });
      if (ev.type === 'cctv') {
        C.cctv.forEach(function (k, i) {
          var s = util.toSec(k.t);
          var useCorr = corrected && off !== null;
          items.push({ sec: useCorr ? s - off : s, t: useCorr ? util.fmt(s - off) : k.t, raw: k.t, label: 'CCTV · ' + k.text.split('.')[0], clock: useCorr ? 'corr' : 'dvr', ev: id, key: i });
        });
      }
    });
    factsUnlocked(state).forEach(function (fid) {
      (C.facts[fid].times || []).forEach(function (tm) {
        items.push({ sec: util.toSec(tm.t), t: tm.t, label: tm.label, clock: 'shared', fact: fid });
      });
    });
    items.sort(function (a, b) { return a.sec - b.sec || (a.clock === 'shared' ? -1 : 1); });
    return items;
  }

  /* ───────── 목표·힌트 ───────── */
  function objectives(state) {
    var n = act(state);
    return C.objectives[n].map(function (o) { return { obj: o, done: check(state, o.done) }; });
  }
  function currentObjective(state) {
    var list = objectives(state);
    for (var i = 0; i < list.length; i++) if (!list[i].done) return list[i].obj;
    return null;
  }
  function useHint(state, key) {
    var hs = C.hints[key]; if (!hs) return null;
    var cur = state.shared.hints[key] || 0;
    if (cur < hs.length) { state.shared.hints[key] = cur + 1; touch(state); }
    return state.shared.hints[key];
  }
  function hintsUsedTotal(state) {
    var h = state.shared.hints, t = { 1: 0, 2: 0, 3: 0 };
    Object.keys(h).forEach(function (k) { for (var i = 1; i <= h[k]; i++) t[i]++; });
    return t;
  }

  /* ───────── 장면 ───────── */
  function queueScene(state, id) {
    if (C.scenes[id] && state.pending.indexOf(id) < 0 && !state.seen[id]) state.pending.push(id);
  }
  function finishScene(state, id) {
    state.pending = state.pending.filter(function (x) { return x !== id; });
    state.seen[id] = Date.now();
    touch(state);
  }
  function chooseEnding(state, choice) {
    if (!conclDone(state, 'FINAL') || ['seal', 'air'].indexOf(choice) < 0) return false;
    state.shared.endingChoice = choice;
    state.shared.completedAt = state.shared.completedAt || Date.now();
    queueScene(state, choice === 'air' ? 'ending_air' : 'ending_seal');
    touch(state);
    return true;
  }

  /* ───────── 역할·노트·가설 ───────── */
  function switchRole(state) { state.role = state.role === 'seoha' ? 'ian' : 'seoha'; touch(state); return state.role; }
  function setNotes(state, role, text) { state.roles[role].notes = String(text || '').slice(0, NOTE_MAX); touch(state); }
  function setSuspect(state, role, who, status) {
    var r = state.roles[role];
    if (SUSPECTS.indexOf(who) < 0 || ['open', 'suspect', 'cleared'].indexOf(status) < 0) return false;
    var prev = r.suspects[who].status;
    if (prev === status) return false;
    r.suspects[who].status = status;
    r.suspectLog.push({ at: Date.now(), who: who, from: prev, to: status, act: act(state) });
    if (r.suspectLog.length > 100) r.suspectLog = r.suspectLog.slice(-100);
    touch(state);
    return true;
  }
  function setSuspectMemo(state, role, who, memo) {
    if (SUSPECTS.indexOf(who) < 0) return;
    state.roles[role].suspects[who].memo = String(memo || '').slice(0, MEMO_MAX);
    touch(state);
  }
  function linkEvidence(state, role, who, evId, stance) {
    var r = state.roles[role];
    if (SUSPECTS.indexOf(who) < 0 || !r.found[evId] || (stance !== 'for' && stance !== 'against' && stance !== null)) return false;
    var list = r.suspects[who].links.filter(function (l) { return l.ev !== evId; });
    if (stance) list.push({ ev: evId, stance: stance });
    r.suspects[who].links = list.slice(-40);
    touch(state);
    return true;
  }
  function weigh(state, boxId) {
    var b = C.boxes.filter(function (x) { return x.id === boxId; })[0];
    if (!b || !locationUnlocked(state, 'staging')) return null;
    var w = state.roles.seoha.weighed;
    if (w.indexOf(boxId) < 0) { w.push(boxId); touch(state); }
    return b.weight;
  }
  function sharedVerdicts(state) {
    var v = {};
    if (conclDone(state, 'IC1')) v.min = 'cleared';
    if (jointDone(state, 'J4')) v.han = 'cleared';
    if (conclDone(state, 'FINAL')) v.yoon = 'culprit';
    return v;
  }
  function tick(state, ms) {
    if (state.phase !== 'play' && state.phase !== 'prologue') return;
    if (state.shared.completedAt) return;
    state.shared.elapsedMs = Math.min(1e9, (state.shared.elapsedMs || 0) + Math.max(0, Math.min(ms, 5000)));
  }

  /* ───────── 저장·복구 ───────── */
  function safeStorage(ls) {

  /* 어떤 입력이 와도 유효한 상태를 만든다. issues에 버린 항목을 적는다. */

    s.created = ts(raw.created);
    if (PHASES.indexOf(raw.phase) >= 0) s.phase = raw.phase; else if (raw.phase !== undefined) issues.push('진행 화면 값');

    if (ROLES.indexOf(raw.role) >= 0) s.role = raw.role;
    s.prologueStep = int(raw.prologueStep, 0, C.scenes.prologue.length, 0);

    var sh = util.isObj(raw.shared) ? raw.shared : {};

    });

    Object.keys(K).forEach(function (id) {
      if (!CONCL[id] || !util.isObj(K[id])) { issues.push('알 수 없는 결론 ' + id); return; }
      s.shared.concl[id] = { done: K[id].done === true, tries: int(K[id].tries, 0, 999, 0), at: K[id].done === true ? ts(K[id].at) : undefined, last: util.isObj(K[id].last) ? K[id].last : undefined };
    });

    Object.keys(H).forEach(function (k) { if (C.hints[k]) s.shared.hints[k] = int(H[k], 0, C.hints[k].length, 0); });

    FLAG_IDS.forEach(function (f) { if (F[f] === true) s.shared.flags[f] = true; });
    if (Array.isArray(sh.opened)) s.shared.opened = sh.opened.filter(function (b, i, a) {
      return C.boxes.some(function (x) { return x.id === b; }) && a.indexOf(b) === i;

    s.shared.elapsedMs = (typeof sh.elapsedMs === 'number' && isFinite(sh.elapsedMs)) ? Math.max(0, Math.min(1e9, sh.elapsedMs)) : 0;

    var R = util.isObj(raw.roles) ? raw.roles : {};

      var src = util.isObj(R[role]) ? R[role] : {}, dst = s.roles[role];

        else issues.push('알 수 없는 증거 ' + id);
      });
      var rd = util.isObj(src.read) ? src.read : {};
      Object.keys(rd).forEach(function (id) { if (dst.found[id]) dst.read[id] = ts(rd[id]); });
      var ex = util.isObj(src.examined) ? src.examined : {};
      Object.keys(ex).forEach(function (id) { if (role === 'seoha' && HOT[id]) dst.examined[id] = ts(ex[id]); });
      if (typeof src.notes === 'string') dst.notes = src.notes.slice(0, NOTE_MAX);
      var su = util.isObj(src.suspects) ? src.suspects : {};
      SUSPECTS.forEach(function (w) {
        var x = util.isObj(su[w]) ? su[w] : {};
        if (['open', 'suspect', 'cleared'].indexOf(x.status) >= 0) dst.suspects[w].status = x.status;
        if (typeof x.memo === 'string') dst.suspects[w].memo = x.memo.slice(0, MEMO_MAX);
        if (Array.isArray(x.links)) dst.suspects[w].links = x.links.filter(function (l) {
          return util.isObj(l) && dst.found[l.ev] && (l.stance === 'for' || l.stance === 'against');
        }).slice(0, 40).map(function (l) { return { ev: l.ev, stance: l.stance }; });
      });
      if (Array.isArray(src.weighed) && role === 'seoha') dst.weighed = src.weighed.filter(function (b, i, a) {
        return C.boxes.some(function (x) { return x.id === b; }) && a.indexOf(b) === i;
      });
      if (Array.isArray(src.suspectLog)) dst.suspectLog = src.suspectLog.filter(function (e) {
        return util.isObj(e) && SUSPECTS.indexOf(e.who) >= 0 && ['open', 'suspect', 'cleared'].indexOf(e.to) >= 0;
      }).slice(-100).map(function (e) {

      });

        return C.registry.some(function (r) { return r.no === n; }) && a.indexOf(n) === i;
      });

      }

    if (Array.isArray(raw.pending)) raw.pending.forEach(function (id) { if (SCENE_IDS.indexOf(id) >= 0) queueScene(s, id); });
    var seen = util.isObj(raw.seen) ? raw.seen : {};
    Object.keys(seen).forEach(function (id) { if (SCENE_IDS.indexOf(id) >= 0) s.seen[id] = ts(seen[id]); });
    s.pending = s.pending.filter(function (id) { return !s.seen[id] && sceneAllowed(s, id); });
    if (s.phase === 'ending' && !conclDone(s, 'FINAL')) { s.phase = 'play'; issues.push('엔딩 상태'); }
    if ((s.phase === 'play' || s.phase === 'pickrole') && !s.mode) s.mode = 'duo';
    if (s.phase === 'prologue' && s.prologueStep >= C.scenes.prologue.length) s.phase = 'pickrole';
    return { state: s, issues: issues };
  }
  function sceneAllowed(s, id) {
    var need = { act2: { concl: 'IC1' }, act3: { concl: 'IC2' }, found: { joint: 'J6' }, confront: { concl: 'FINAL' },
      ending_seal: { concl: 'FINAL' }, ending_air: { concl: 'FINAL' } }[id];
    return check(s, need);
  }
  /* 선후 관계가 깨진 진행을 앞에서부터 다시 세운다 */
  function repair(s, issues) {
    var order = ['J1', 'J2', 'IC1', 'J3', 'MATCH', 'IC2', 'J4', 'J5', 'J6', 'FINAL'];
    var claimed = {};
    order.forEach(function (id) {

    });
    // 앞 단계부터 하나씩 다시 인정한다 (뒤 단계가 앞 단계의 조건을 대신하지 못하게)

      else { delete rec.at; issues.push((isJ ? '분석 ' : '결론 ') + id + ' 선행 조건'); }
    });
    if (s.shared.flags.b1Unlocked && !conclDone(s, 'IC2')) { delete s.shared.flags.b1Unlocked; issues.push('지하 출입'); }
    if (!conclDone(s, 'FINAL')) { s.shared.endingChoice = null; s.shared.completedAt = null; }
    // 완료된 분석이 주는 증거는 반드시 있어야 한다
    Object.keys(s.shared.joints).forEach(function (id) { if (s.shared.joints[id].done) grant(s, JOINT[id].grants); });
    if (jointDone(s, 'J5') && s.shared.opened.indexOf('C-4') < 0) s.shared.opened.push('C-4');
  }

  }

    state.updated = Date.now();

  }
  /* status: 'new' | 'ok' | 'repaired' | 'corrupt' | 'legacy' */
  function load(store) {

        if (typeof old.notes.B === 'string' && old.notes.B) { s.roles.ian.notes = ('[이전 체험판 노트]\n' + old.notes.B).slice(0, NOTE_MAX); notes++; }
      }

  }

  LB.util = util;
  LB.engine = {
    SAVE_KEY: SAVE_KEY, SETTINGS_KEY: SETTINGS_KEY, SAVE_VERSION: SAVE_VERSION, ROLES: ROLES, SUSPECTS: SUSPECTS,
    EV: EV, HOT: HOT, TOPIC: TOPIC,
    newState: newState, defaultSettings: defaultSettings,
    act: act, check: check, jointDone: jointDone, conclDone: conclDone, hasFound: hasFound,

    topicUnlocked: topicUnlocked, ask: ask, topicsFor: topicsFor,
    stationItemUnlocked: stationItemUnlocked, openRecord: openRecord, audioLibrary: audioLibrary, runAction: runAction, searchRegistry: searchRegistry,
    jointAvailable: jointAvailable, submitJoint: submitJoint, jointsForAct: jointsForAct,
    recMarkers: recMarkers, recScript: recScript, compareMarkers: compareMarkers,

    switchRole: switchRole, setNotes: setNotes, setSuspect: setSuspect, setSuspectMemo: setSuspectMemo, linkEvidence: linkEvidence, weigh: weigh, sharedVerdicts: sharedVerdicts, tick: tick,
    safeStorage: safeStorage, sanitize: sanitize, serialize: serialize, save: save, load: load,

(function (root) {

  var P = {
    ink: '#0b0e11', wall: '#1a2228', wall2: '#222c33', floor: '#141a1e', line: '#3a4750',
    dim: '#56646d', paper: '#d8cdb3', amber: '#e8a63a', red: '#d65a43', cyan: '#6fb6c6', green: '#5fbf7f', white: '#e9e3d6'

    } else if (st === 'repaired') {
      openInfo('저장 데이터를 복구했습니다', '<p>일부 항목이 손상되었거나 앞뒤가 맞지 않아 제외하고 불러왔습니다. 확인된 진행은 그대로 남아 있습니다.</p><ul class="issues">' +
        loadInfo.issues.slice(0, 6).map(function (i) { return '<li>' + e(i) + '</li>'; }).join('') + (loadInfo.issues.length > 6 ? '<li>외 ' + (loadInfo.issues.length - 6) + '건</li>' : '') + '</ul>');

    }
  }
  function tickTimer() {
    if (document.visibilityState !== 'visible' || ui.atTitle) return;

    if (ui.tickCount % 15 === 0) persistIfChanged();
  }
  function fmtElapsed(ms) {
    var s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    return (h ? h + ':' : '') + (m < 10 && h ? '0' : '') + m + ':' + (x < 10 ? '0' : '') + x;
  }

  /* ───────── 렌더 ───────── */
  function render(opt) {
    stopPlayer();
    var prevKey = ui.viewKey;
    var html;
    if (ui.replay) html = renderScene(ui.replay.id, true);
    else if (ui.atTitle) html = renderTitle();
    else if (S.phase === 'prologue') html = renderPrologue();
    else if (S.pending.length) html = renderScene(S.pending[0], false);
    else if (S.phase === 'pickrole') html = renderPickRole();
    else if (S.phase === 'ending') html = renderEnding();
    else html = renderPlay();
    app.innerHTML = html;
    afterRender(prevKey, opt || {});
  }
  function afterRender(prevKey, opt) {
    document.body.dataset.role = (ui.atTitle || S.phase !== 'play') ? '' : S.role;
    var af = app.querySelector('[data-autofocus]');
    if (opt.focus) { var f = app.querySelector(opt.focus); if (f) f.focus(); }
    else if (af) af.focus({ preventScroll: true });
    else if (ui.viewKey !== prevKey) {
      var h = app.querySelector('.view-title');
      if (h) h.focus({ preventScroll: true });
    }
    if (ui.viewKey !== prevKey && !opt.keepScroll) window.scrollTo(0, 0);
    mountDynamic();
  }

  /* ───────── 타이틀 ───────── */

  function progressLabel() {

  /* ───────── 도입부 ───────── */
  function renderPrologue() {
    ui.viewKey = 'prologue';
    return renderSceneBeats(C.scenes.prologue, S.prologueStep, 'prologue', false);
  }
  function renderScene(id, replay) {
    ui.viewKey = 'scene:' + id;
    var beats = C.scenes[id];
    var idx = replay ? ui.replay.beat : (ui.sceneBeat && ui.sceneBeat.id === id ? ui.sceneBeat.beat : 0);
    return renderSceneBeats(beats, idx, id, replay);
  }
  /* 조건이 붙은 대사는 플레이 중 확보한 사실이 있을 때만 나온다 */
  function beatLines(b) { return b.lines.filter(function (l) { return !l[2] || E.check(S, l[2]); }); }
  function renderSceneBeats(beats, idx, id, replay) {
    idx = Math.min(idx, beats.length - 1);
    var b = Object.assign({}, beats[idx]);
    b.lines = beatLines(beats[idx]);
    var lineMax = ui.sceneLine;
    var lines = b.lines.slice(0, Math.max(1, lineMax + 1));
    var allShown = lines.length >= b.lines.length;
    var actionDone = !b.action || actionTaken(b, replay);
    var isChoice = !!b.choice;
    var lastBeat = idx >= beats.length - 1;
    var html = '<div class="scene" data-scene="' + e(id) + '">' +
      '<div class="scene-art">' + A.scene(b.art) + '</div>' +
      '<div class="scene-panel">' +
      '<div class="scene-head"><span class="scene-time">' + e(b.time) + '</span><span class="scene-place">' + e(b.place) + '</span>' +
      '<span class="scene-count">' + (idx + 1) + ' / ' + beats.length + '</span></div>' +
      '<h1 class="sr-only view-title" tabindex="-1">' + e(sceneTitle(id)) + '</h1>' +
      '<ol class="lines" aria-live="polite">' + lines.map(function (l) { return lineHtml(l); }).join('') + '</ol>';
    if (b.action && allShown && !actionDone) {
      html += '<div class="scene-actions"><button class="btn primary" data-act="scene-action" data-autofocus>' + e(b.action.label) + '</button></div>';
    } else if (b.action && actionDone && allShown) {
      html += '<p class="after">' + e(b.action.after) + '</p>';
    }
    if (isChoice && allShown && !replay) {
      html += '<div class="scene-actions choice">' + b.choice.map(function (c, i) {
        return '<button class="btn ' + (i === 0 ? 'primary' : '') + '" data-act="scene-choice" data-id="' + e(c.id) + '"' + (i === 0 ? ' data-autofocus' : '') + '>' + e(c.label) + '</button>';
      }).join('') + '</div>';
    } else if (!(b.action && allShown && !actionDone)) {
      html += '<div class="scene-actions"><button class="btn primary" data-act="scene-next" data-autofocus>' +
        (allShown ? (lastBeat ? (replay ? '닫기' : (id === 'prologue' ? '수사 시작' : '계속')) : '다음 장면') : '다음') + ' <span aria-hidden="true">›</span></button></div>';
    }
    html += '<div class="scene-foot">' +
      (!isChoice || replay ? '<button class="btn small ghost" data-act="scene-skip">' + (replay ? '다시 보기 닫기' : '장면 건너뛰기') + '</button>' : '') +
      '<span class="kbd-hint">Enter · Space: 다음</span></div>' +
      '</div></div>';
    return html;
  }
  function sceneTitle(id) {
    return { prologue: '도입부', act2: '2막 · 목소리의 빈자리', act3: '3막 · 마지막 송출', found: '원본 발견', confront: '대면', ending_seal: '엔딩', ending_air: '엔딩' }[id] || '장면';
  }
  function lineHtml(l) {
    var who = l[0], text = l[1];
    if (who === 'narr') return '<li class="line narr">' + e(text) + '</li>';
    if (who === 'radio') return '<li class="line radio"><span class="who">스피커</span>' + e(text) + '</li>';
    var p = person(who);
    return '<li class="line say ' + e(who) + '"><span class="who">' + e(p.name) + '</span><span class="said">' + e(text) + '</span></li>';
  }
  function actionTaken(b, replay) {
    if (replay) return true;
    var spec = b.action.grant;
    return E.ROLES.every(function (r) { return !spec[r] || spec[r].every(function (id) { return E.hasFound(S, id); }); });
  }
  function currentBeats() {
    if (ui.replay) return { beats: C.scenes[ui.replay.id], id: ui.replay.id, idx: ui.replay.beat };
    if (S.phase === 'prologue') return { beats: C.scenes.prologue, id: 'prologue', idx: S.prologueStep };
    var id = S.pending[0];
    if (!id) return null;
    if (!ui.sceneBeat || ui.sceneBeat.id !== id) ui.sceneBeat = { id: id, beat: 0 };
    return { beats: C.scenes[id], id: id, idx: ui.sceneBeat.beat };
  }
  function sceneNext(skipAll) {
    var cb = currentBeats(); if (!cb) return;
    var b0 = cb.beats[Math.min(cb.idx, cb.beats.length - 1)];
    var b = Object.assign({}, b0, { lines: beatLines(b0) });
    if (!skipAll && ui.sceneLine < b.lines.length - 1) { ui.sceneLine++; sfx('click'); render({ keepScroll: true }); return; }
    if (b.action && !actionTaken(b, !!ui.replay)) {
      if (!skipAll) { ui.sceneLine = b.lines.length - 1; render({ keepScroll: true }); return; }
    }
    if (skipAll) {
      // 건너뛰어도 장면이 주는 증거는 모두 받는다
      if (!ui.replay) cb.beats.forEach(function (bb) { if (bb.action) E.grantSpec(S, bb.action.grant); });
      if (b.choice && !ui.replay) { ui.sceneLine = b.lines.length - 1; jumpToBeat(cb, cb.beats.length - 1); return; }
      endScene(cb);
      return;
    }
    if (cb.idx < cb.beats.length - 1) { jumpToBeat(cb, cb.idx + 1); if (cb.beats[cb.idx + 1].sfx) sfx(cb.beats[cb.idx + 1].sfx === 'shutter' ? 'rumble' : cb.beats[cb.idx + 1].sfx); return; }
    endScene(cb);
  }
  function jumpToBeat(cb, n) {

    render();
  }
  function endScene(cb) {
    ui.sceneLine = 0;

      var next = ui.replay.queue.shift();
      if (next) { ui.replay.id = next; ui.replay.beat = 0; } else { ui.replay = null; ui.atTitle = ui.replayFromTitle; }
      render(); return;
    }
    if (cb.id === 'prologue') {
      S.prologueStep = C.scenes.prologue.length;
      S.phase = 'pickrole';
      persist(); render(); return;
    }
    E.finishScene(S, cb.id);
    ui.sceneBeat = null;
    persist();
    if (cb.id === 'act2' || cb.id === 'act3') toast(C.acts[E.act(S) - 1].id + '막 · ' + C.acts[E.act(S) - 1].title + ' — 새 자료가 열렸습니다.', 'good');
    render();
  }
  function sceneAction() {
    var cb = currentBeats(); if (!cb) return;
    var b = cb.beats[cb.idx];

    sfx(b.action.sfx || 'click');
    persist();
    render({ keepScroll: true });
  }
  function sceneChoice(id) {
    if (!E.chooseEnding(S, id)) return;
    E.finishScene(S, 'confront');
    ui.sceneBeat = null; ui.sceneLine = 0;
    persist(); sfx('tape'); render();
  }

  /* ───────── 역할 선택 ───────── */
  function renderPickRole() {
    ui.viewKey = 'pickrole';
    var solo = S.mode === 'solo';
    return '<div class="pick">' +
      '<h1 class="view-title" tabindex="-1">누가 먼저 조사할까요?</h1>' +
      '<p class="lead">' + (solo ? '검수 모드입니다. 두 역할을 상단 버튼으로 바로 오갈 수 있습니다.' : '한 기기를 번갈아 씁니다. 지금 화면을 볼 사람이 고르세요. 상대는 잠시 화면을 보지 않는 편이 좋습니다.') + '</p>' +
      '<div class="pick-grid">' + ['seoha', 'ian'].map(function (r) {
        var p = person(r);
        return '<button class="pick-card ' + r + '" data-act="start-role" data-role="' + r + '"' + (r === 'seoha' ? ' data-autofocus' : '') + '>' +
          A.portrait(r, 72) + '<span class="pick-name">' + e(p.name) + ' <small>' + e(p.role) + '</small></span>' +
          '<span class="pick-desc">' + e(C.roles[r].hint) + '</span><span class="pick-go">' + e(U.josa(p.name, '으로/로')) + ' 시작 →</span></button>';

  }

  /* ───────── 수사 화면 ───────── */
  var NAV = [
    { id: 'inv', label: '조사', icon: '⌖' },
    { id: 'evidence', label: '증거함', icon: '▤' },
    { id: 'timeline', label: '시간표', icon: '⏱' },
    { id: 'board', label: '사건 보드', icon: '⊞' },
    { id: 'notes', label: '노트', icon: '✎' }
  ];
  function view() {
    var v = R().view;
    if (!v || !v.name) v = R().view = { name: role() === 'seoha' ? 'map' : 'bms', param: null };
    if (v.name === 'loc' && !E.locationUnlocked(S, v.param)) v = R().view = { name: 'map', param: null };

      '<div class="top-actions">' +

      '<button class="btn small icon" data-act="settings" aria-label="메뉴와 설정">☰</button>' +

  /* 이안: 음원 */
  function viewAudio() {
    var lib = E.audioLibrary(S);
    lib.forEach(function (it) { E.openRecord(S, it.ev); });
    if (!lib.some(function (it) { return evd(it.ev).rec === ui.audioSel; })) ui.audioSel = 'onair';
    var sel = ui.audioSel;
    E.markRead(S, 'ian', lib.filter(function (it) { return evd(it.ev).rec === sel; })[0].ev);
    var files = '<ul class="files" role="listbox" aria-label="음원 목록">' + lib.map(function (it) {
      var ev = evd(it.ev), rec = C.recordings[ev.rec];
      return '<li><button class="file' + (sel === ev.rec ? ' on' : '') + '" data-act="rec-select" data-id="' + ev.rec + '" aria-pressed="' + (sel === ev.rec) + '">' +
        '<span class="fn">' + e(rec.file) + (R().read[it.ev] ? '' : ' <span class="dot"></span>') + '</span><span class="fd">' + e(rec.label) + ' · ' + U.mmss(rec.dur) + '</span></button></li>';
    }).join('') + '</ul>';
    var cmp = '';
    if (E.conclDone(S, 'IC1')) {
      var others = lib.map(function (it) { return evd(it.ev).rec; }).filter(function (r) { return r !== 'onair'; });
      if (others.indexOf(ui.cmpOther) < 0) ui.cmpOther = others[0];
      var m = E.compareMarkers('onair', ui.cmpOther, ui.cmpOffset);
      cmp = '<section class="compare" aria-labelledby="cmpH"><h3 id="cmpH">음원 비교</h3>' +
        '<p class="view-sub">위: 송출 감시 녹음 (21:44:30 시작). 아래 파일을 밀어서 표시가 겹치는지 보세요.</p>' +
        '<label class="field inline">비교할 파일 <select data-act="cmp-file">' + others.map(function (r) {
          return '<option value="' + r + '"' + (r === ui.cmpOther ? ' selected' : '') + '>' + e(C.recordings[r].file) + '</option>';
        }).join('') + '</select></label>' +
        '<div class="cmp-stage">' + waveSvg('onair', { compact: true }) + waveSvg(ui.cmpOther, { compact: true, offset: ui.cmpOffset, baseDur: C.recordings.onair.dur, id: 'cmpWave' }) + '</div>' +
        '<label class="field slider">아래 파일 시작 위치: <output id="cmpOut">' + ui.cmpOffset.toFixed(1) + '초</output>' +
        '<input type="range" min="0" max="60" step="0.5" value="' + ui.cmpOffset + '" data-act="cmp-offset" aria-describedby="cmpMatch"></label>' +
        '<div class="cmp-nudge"><button class="btn small" data-act="cmp-nudge" data-d="-1">−1초</button><button class="btn small" data-act="cmp-nudge" data-d="-0.5">−0.5</button><button class="btn small" data-act="cmp-nudge" data-d="0.5">+0.5</button><button class="btn small" data-act="cmp-nudge" data-d="1">+1초</button></div>' +
        '<p class="cmp-match" id="cmpMatch" aria-live="polite">겹친 표시 <strong>' + m.matched + ' / ' + m.total + '</strong></p>' +
        (E.jointDone(S, 'MATCH') ? '<p class="ok-line">✓ 대조 결과 등록됨 — 송출 = REC_1800_T2</p>' : '<button class="btn primary" data-act="match-submit">이 위치로 대조 결과 등록</button>') +
        '<div id="matchMsg" class="fb" role="alert"></div></section>';

    return invTabs('audio') + '<h2 class="view-title" tabindex="-1">음원 작업대</h2><p class="view-sub">' + e(C.audioNote) + (AU.active() ? '' : ' 지금은 효과음이 꺼져 있어 무음으로 재생됩니다.') + '</p>' +
      '<div class="audio-grid">' + files + '<div class="player">' + renderPlayer(sel) + '</div></div>' +
      '<div class="tool-row">' + jointButton('J3', '금속음의 출처 판단') + '</div>' + cmp;

  function renderPlayer(recId) {
    var rec = C.recordings[recId];
    var script = E.recScript(recId), marks = E.recMarkers(recId);
    var items = script.map(function (s) { return { t: s[0], kind: 'line', text: s[1] }; })
      .concat(marks.map(function (m) { return { t: m[0], kind: 'mark', text: '[' + C.markerLabels[m[1]] + ']' }; }));
    rec.segments.forEach(function (sg) { if (sg[2] === 'music') items.push({ t: sg[0], kind: 'mark', text: '[음악]' }); });
    items.sort(function (a, b) { return a.t - b.t; });
    var startStd = rec.start ? U.toSec(rec.start) : null;
    return '<div class="player-head"><strong>' + e(rec.file) + '</strong><span>' + e(rec.label) + '</span></div>' +
      waveSvg(recId, { id: 'mainWave' }) +
      '<div class="transport"><button class="btn small" data-act="rec-play" id="playBtn">▶ 재생</button>' +
      '<button class="btn small" data-act="rec-stop">■ 정지</button>' +
      '<span class="ptime" id="ptime">00:00' + (startStd !== null ? ' · ' + rec.start : '') + '</span></div>' +
      '<ol class="script" id="script">' + items.map(function (it) {
        return '<li class="' + it.kind + '" data-t="' + it.t + '"><button class="ts" data-act="rec-seek" data-t="' + it.t + '">' + U.mmss(it.t) + (startStd !== null ? '<small>' + U.fmt(startStd + it.t) + '</small>' : '') + '</button><span>' + e(it.text) + '</span></li>';
      }).join('') + '</ol>';
  }
  function waveSvg(recId, opt) {
    opt = opt || {};
    var rec = C.recordings[recId], data = A.waveform(recId);
    var W = 1000, H = opt.compact ? 70 : 110, mid = H / 2;
    var dur = opt.baseDur || rec.dur;
    var pps = W / dur;
    var off = (opt.offset || 0) * pps;
    var d = '';
    for (var i = 0; i < data.length; i += (data.length > 900 ? 2 : 1)) {
      var x = (i / 4) * pps + off;
      if (x > W) break;
      var a = data[i] * (mid - 6);
      d += 'M' + x.toFixed(1) + ' ' + (mid - a).toFixed(1) + 'V' + (mid + a).toFixed(1);
    }
    var marks = E.recMarkers(recId).map(function (m) {
      var x = m[0] * pps + off;
      var col = m[1] === 'clank' ? '#e8a63a' : m[1] === 'page' ? '#6fb6c6' : '#d65a43';
      return '<g><line x1="' + x + '" x2="' + x + '" y1="0" y2="' + H + '" stroke="' + col + '" stroke-width="2" opacity=".9"/><circle cx="' + x + '" cy="6" r="5" fill="' + col + '"/></g>';
    }).join('');
    var ticks = '';
    for (var s = 0; s <= dur; s += 30) ticks += '<line x1="' + s * pps + '" x2="' + s * pps + '" y1="' + (H - 6) + '" y2="' + H + '" stroke="#56646d"/>';
    return '<div class="wave' + (opt.compact ? ' compact' : '') + '"' + (opt.id ? ' id="' + opt.id + '"' : '') + '><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="' + e(rec.file) + ' 파형. 표시: ' + markerSummary(recId) + '">' +
      '<rect width="' + W + '" height="' + H + '" fill="#0c1216"/><path d="' + d + '" stroke="#6fb6c6" stroke-width="1.6" opacity=".75"/>' + ticks + marks +
      (opt.compact ? '' : '<line class="playhead" x1="0" x2="0" y1="0" y2="' + H + '" stroke="#fff" stroke-width="2"/>') + '</svg>' +
      '<div class="wave-legend"><span class="lg clank">● 금속음</span><span class="lg cough">● 기침</span><span class="lg page">● 종이</span></div></div>';
  }
  function markerSummary(recId) {
    var m = E.recMarkers(recId);
    if (!m.length) return '없음';
    return m.map(function (x) { return U.mmss(x[0]) + ' ' + C.markerLabels[x[1]]; }).join(', ');
  }

  function loggerSeries(lg) {
    var w0 = U.toSec(C.loggers.window[0]), w1 = U.toSec(C.loggers.window[1]);
    var pts = [];

      var t = lg.base.t, h = lg.base.h;
      if (lg.drop) {
        var d0 = U.toSec(lg.drop.at);
        if (s >= d0) t = lg.drop.to + (lg.base.t - lg.drop.to) * Math.exp(-(s - d0) / (lg.drop.mins * 60 / 3));
      }
      lg.events.forEach(function (ev) {
        var a = U.toSec(ev.at);
        if (s + 59 >= a) {
          var dt = Math.max(0, s - a) / 60;
          var k = Math.exp(-dt / ev.decay);
          h += ev.h * k; t += ev.t * k;

      var pT = pts.map(function (p, i) { return (i ? 'L' : 'M') + x(p.s).toFixed(1) + ' ' + yT(p.t).toFixed(1); }).join('');
      var pH = pts.map(function (p, i) { return (i ? 'L' : 'M') + x(p.s).toFixed(1) + ' ' + yH(p.h).toFixed(1); }).join('');

        '<path d="' + pH + '" stroke="#6fb6c6" stroke-width="2" fill="none"/><path d="' + pT + '" stroke="#e8a63a" stroke-width="2" fill="none" stroke-dasharray="5 3"/></svg>' +
        '<p class="lg-key"><span class="h">— 습도</span><span class="t">- - 온도</span></p><p class="lg-ev">' + e(evText) + '</p></li>';

  /* ───────── 플레이어 ───────── */
  function stopPlayer() {
    if (ui.player) { cancelAnimationFrame(ui.player.raf); ui.player.audio.stop(); ui.player = null; var b = $('#playBtn'); if (b) b.textContent = '▶ 재생'; }
  }
  function playRec(from) {
    var recId = ui.audioSel, rec = C.recordings[recId];
    stopPlayer();
    from = Math.max(0, Math.min(rec.dur - 0.5, from || ui.playPos || 0));
    var audio = AU.playRecording(recId, from, rec.dur - from);
    var t0 = performance.now();
    var p = { audio: audio, raf: 0, from: from };
    ui.player = p;
    var b = $('#playBtn'); if (b) b.textContent = '❚❚ 일시정지';
    var lines = Array.prototype.slice.call(document.querySelectorAll('#script li'));
    var head = document.querySelector('#mainWave .playhead');
    var ptime = $('#ptime');
    var startStd = rec.start ? U.toSec(rec.start) : null;
    var lastIdx = -1;
    (function frame() {
      var t = from + (performance.now() - t0) / 1000;
      if (t >= rec.dur) { ui.playPos = 0; stopPlayer(); return; }
      ui.playPos = t;
      if (head) { var x = (t / rec.dur) * 1000; head.setAttribute('x1', x); head.setAttribute('x2', x); }
      if (ptime) ptime.textContent = U.mmss(t) + (startStd !== null ? ' · ' + U.fmt(startStd + t) : '');
      var idx = -1;
      for (var i = 0; i < lines.length; i++) if (+lines[i].dataset.t <= t) idx = i;
      if (idx !== lastIdx) {
        lines.forEach(function (l, i) { l.classList.toggle('now', i === idx); });
        lastIdx = idx;
      }
      p.raf = requestAnimationFrame(frame);
    })();
  }

    });

  function onKey(ev) {

  function onClick(ev) {
    var t = ev.target.closest('[data-act]');
    if (!t || t.disabled || t.getAttribute('aria-disabled') === 'true' && t.dataset.act !== 'loc') return;

        else openModeSelect();

      case 'mode':
        S = E.newState(); S.mode = id; S.phase = 'prologue'; S.prologueStep = 0;
        ui.atTitle = false; ui.sceneLine = 0; ui.drafts = {}; ui.finalDraft = null; ui.lastResults = null;
        persist(); closeModal(); render(); break;
      case 'continue': AU.unlock(); ui.atTitle = false; ui.sceneLine = 0; render(); break;

        break;

      case 'nav':
        var vn = t.dataset.view;
        if (vn === 'inv') {
          // 이미 조사 화면이면 첫 화면(평면도·건물 기록)으로, 다른 화면에서 오면 마지막 조사 화면으로
          var root = { name: S.role === 'seoha' ? 'map' : 'bms', param: null };
          var cur = navGroup(view().name) === 'inv' ? (view().name === 'loc' || view().name === 'person' ? root : view()) : (ui.lastInv[S.role] || root);
          if (cur.name === 'loc' && !E.locationUnlocked(S, cur.param)) cur = { name: 'map', param: null };
