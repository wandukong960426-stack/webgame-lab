<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111919"><title>마지막 송출 | 두 사람의 사건파일</title><style>
:root{--bg:#101817;--panel:#182321;--line:#34423b;--text:#e9e6dc;--muted:#abb7aa;--accent:#e9b969;--mint:#b9d6bf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 system-ui,-apple-system,'Segoe UI',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button,a,input,textarea,select{outline-offset:5px}button:focus-visible,a:focus-visible{outline:2px solid var(--accent)}button{border:1px solid var(--line);background:transparent;color:var(--text);padding:12px 19px;border-radius:5px}button:hover{border-color:var(--accent);background:#ffffff08}button.primary{background:var(--accent);color:#201e18;border-color:var(--accent);font-weight:700}header{max-width:1240px;margin:auto;padding:23px 30px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);gap:12px}.brand{font-weight:800;letter-spacing:2px;font-size:13px}.tiny{font-size:12px;letter-spacing:2px;color:var(--muted)}main{max-width:1180px;margin:auto;padding:45px 30px 70px}h1{font-family:Georgia,'Batang',serif;font-size:clamp(46px,7vw,88px);font-weight:500;line-height:1.12;letter-spacing:-4px;margin:24px 0}h2{font-size:28px;line-height:1.4}h3{font-size:19px}p{color:var(--muted)}.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:60px;align-items:center;min-height:480px}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:3px}.lead{font-size:19px;max-width:470px}.tags{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}.tag{font-size:12px;border:1px solid var(--line);padding:5px 10px;border-radius:30px;color:var(--mint)}.art{aspect-ratio:1/1;background:radial-gradient(ellipse at 50% 40%,#3a473a,#101817 72%);position:relative;display:grid;place-items:center}.art svg{width:96%;filter:drop-shadow(0 25px 25px #0008)}.art .stamp{position:absolute;bottom:20px;right:0;transform:rotate(-8deg);color:var(--accent);border:1px solid var(--accent);padding:5px 14px;font-size:12px;letter-spacing:3px}.introline{border-top:1px order:0;padding:8px 0;color:var(--muted);font-size:13px}.end{max-width:760px;margin:auto}.end h1{font-size:58px}.solution{border:1px solid var(--line);padding:24px;margin:25px 0;background:var(--panel)}.solution p{color:#d3dbcf}.meter{height:3px;background:var(--line);margin:15px 0}.meter i{display:block;background:var(--accent);height:3px}.feedback{display:flex;gap:8px;flex-wrap:wrap}.selected{border-color:var(--accent);color:var(--accent)}footer{border-top:1px solid var(--line);padding:20px 30px;text-align:center;color:var(--muted);font-size:12px}dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);max-width:480px;padding:28px}dialog::backdrop{background:#000b}.banner{font-size:13px;padding:10px 16px;border:1px solid var(--line);color:var(--muted);margin-bottom:25px}@media(max-width:760px){header{padding:18px}.hero{grid-template-columns:1fr;gap:0;min-height:0}.art{max-width:370px;margin:auto;order:-1;width:100%;max-height:230px;overflow:hidden}.hero h1{margin-top:14px}.roles,.cards{grid-template-columns:1fr}.workspace{grid-template-columns:1fr;gap:15px}.side{border-right:0;border-bottom:1px solid var(--line);padding:0 0 15px;display:flex;gap:7px;flex-wrap:wrap}.side button{width:auto;flex:1;min-width:95px;text-align:center;font-size:12px;padding:10px 6px}.side .count{width:100%}main{padding:25px 18px 45px}.introline{flex-direction:column;gap:0;margin-top:30px}.sectiontitle{align-items:flex-start}.sectiontitle h2{font-size:24px}.card{min-height:0}.end h1{font-size:45px}h1{letter-spacing:-2px}.tiny{letter-spacing:0}}
</style></head><body><header><div class="brand">두 사람의 사건파일 <span style="color:var(--accent)">/ 001</span></div><div class="tiny">독립 체험판 · 마지막 송출</div></header><main id="app"></main><footer>서로 다른 증거, 하나의 진실. · 모든 인물과 사건은 허구입니다.</footer><dialog id="switch"><h2>수사관을 바꿀까요?</h2><p>지금 화면을 상대에게 넘겨주세요. 서로의 증거를 대신 읽지 않고 말로 전달하면 협동 추리가 더 재미있습니다.</p><div class="row"><button id="cancelSwitch">취소</button><button class="primary" id="confirmSwitch">화면을 넘겼어요</button></div></dialog><script src="game.js"></script></body></html>
