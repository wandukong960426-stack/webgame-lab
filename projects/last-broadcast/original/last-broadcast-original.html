<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111919"><title>마지막 송출 | 두 사람의 사건파일</title><style>

order:0;padding:8px 0;color:var(--muted);font-size:13px}.end{max-width:760px;margin:auto}.end h1{font-size:58px}.solution{border:1px solid var(--line);padding:24px;margin:25px 0;background:var(--panel)}.solution p{color:#d3dbcf}.meter{height:3px;background:var(--line);margin:15px 0}.meter i{display:block;background:var(--accent);height:3px}.feedback{display:flex;gap:8px;flex-wrap:wrap}.selected{border-color:var(--accent);color:var(--accent)}footer{border-top:1px solid var(--line);padding:20px 30px;text-align:center;color:var(--muted);font-size:12px}dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);max-width:480px;padding:28px}dialog::backdrop{background:#000b}.banner{font-size:13px;padding:10px 16px;border:1px solid var(--line);color:var(--muted);margin-bottom:25px}@media(max-width:760px){header{padding:18px}.hero{grid-template-columns:1fr;gap:0;min-height:0}.art{max-width:370px;margin:auto;order:-1;width:100%;max-height:230px;overflow:hidden}.hero h1{margin-top:14px}.roles,.cards{grid-template-columns:1fr}.workspace{grid-template-columns:1fr;gap:15px}.side{border-right:0;border-bottom:1px solid var(--line);padding:0 0 15px;display:flex;gap:7px;flex-wrap:wrap}.side button{width:auto;flex:1;min-width:95px;text-align:center;font-size:12px;padding:10px 6px}.side .count{width:100%}main{padding:25px 18px 45px}.introline{flex-direction:column;gap:0;margin-top:30px}.sectiontitle{align-items:flex-start}.sectiontitle h2{font-size:24px}.card{min-height:0}.end h1{font-size:45px}h1{letter-spacing:-2px}.tiny{letter-spacing:0}}
</style></head><body><header><div class="brand">두 사람의 사건파일 <span style="color:var(--accent)">/ 001</span></div><div class="tiny">독립 체험판 · 마지막 송출</div></header><main id="app"></main><footer>서로 다른 증거, 하나의 진실. · 모든 인물과 사건은 허구입니다.</footer><dialog id="switch"><h2>수사관을 바꿀까요?</h2><p>지금 화면을 상대에게 넘겨주세요. 서로의 증거를 대신 읽지 않고 말로 전달하면 협동 추리가 더 재미있습니다.</p><div class="row"><button id="cancelSwitch">취소</button><button class="primary" id="confirmSwitch">화면을 넘겼어요</button></div></dialog><script>
'use strict';
const evidence={
A:[
[['A-01 / 현장 사진 기록','꺼져 있던 복도','보관실 앞 CCTV에 찍힌 마지막 화면.\n화면 표시는 21:54.\n천장 조명이 꺼지는 순간, 흰 장갑을 낀 사람이 보관실에서 나온다. 얼굴은 화면 밖이다.\n\n금고는 21:30까지 봉인되어 있었다.'],['A-02 / 직원 진술','세 사람의 밤','윤서진 · 편성국장\n“21:45부터 21:50까지 생방송을 했어요. 제 목소리가 나갔잖아요.”\n\n한도윤 · 음향기사\n“21:42부터 21:50까지 외부 송신탑에 있었습니다.”\n\n민해수 · 기록 담당\n“21:44부터 21:49까지 접수실에서 택배 기사와 함께 있었어요.”']],
[['A-03 / 종이 라벨','보관함 분류표','폐국 자료 보관함의 세 칸은 왼쪽부터 다음과 같이 표시되어 있다.\n\n파도 / 종 / 새\n\n종이봉투에 적힌 메모: “기호를 왼쪽부터 숫자로 바꿀 것. 순서를 바꾸지 말 것.”'],['A-04 / 생방송 메모','두 번 들린 같은 기침','21:45 방송을 받아 적은 기록.\n“내일 이곳은 … [기침 두 번] … 문을 닫습니다.”\n\n이 문장과 기침의 간격이 오후 18:00 리허설과 정확히 같았다. 녹음 재생인지 확인하려면 송출 로그가 필요하다.']],
[['A-05 / 보관함 안쪽','빨간 운송 상자','보관함 731 안에서 빨간 운송 상자의 탄소 복사 전표를 발견했다.\n목적지: 지하 반출 대기실 · 선반 C\n내용물: 원본 마스터 릴 1개\n작성: 윤서진\n\n상자 겉면의 “폐기용 빈 릴” 표시는 복사 전표의 내용과 다르다.'],['A-06 / 대조한 출입 영상','거짓말이 아닌 두 진술','외부 송신탑은 도보 12분 거리다. 한도윤은 21:42~21:50 영상에 계속 등장한다.\n민해수 역시 접수실의 21:44~21:49 연속 영상에서 자리를 뜨지 않는다.\n\n시간은 모두 보정된 표준시. 두 영상에는 편집이나 누락이 없다.']]
],
B:[
[['B-01 / 장비 점검표','어긋난 시계','복도 CCTV 시계는 표준시보다 정확히 7분 빠르다.\n\n금일 점검 후에도 수정하지 못했다.\nCCTV 표시에서 7분을 빼면 실제 시각이다.\n\n수사 기록의 다른 시각은 모두 표준시다.'],['B-02 / 전력 기록','우연이 아닌 정전','복도 조명만 21:47~21:49 꺼졌다. 보관실 전원과 잠금장치는 정상 작동했다.\n\n조명 제어는 송출실 콘솔에서 수동으로 실행됐다. 원격 접속과 예약 실행은 지원하지 않는다.\n\n첫 조사에서는 CCTV 속 사람이 나온 실제 시각을 확정해야 한다.']],
[['B-03 / 관리자의 수첩','기호를 읽는 방법','폐국 자료함 기호 대응표\n\n새 = 1\n달 = 9\n파도 = 7\n종 = 3\n별 = 5\n\n현장에 붙은 세 기호의 순서가 비밀번호다.'],['B-04 / 송출 로그','마이크는 열리지 않았다','21:45:00 — 파일 REHEARSAL_1800.wav 재생\n21:45:00~21:50:00 — 스튜디오 마이크 입력 OFF\n21:47:00 — 복도 조명 수동 OFF\n\n리허설 파일은 윤서진의 목소리다. 방송에 목소리가 나갔다는 사실은 스튜디오에 있었다는 증거가 아니다.']],
[['B-05 / 봉인 로그','원본이 빠져나간 순간','보관실 금고: 21:30 봉인 완료 / 원본 재고 1\n21:46 — 윤서진에게 발급된 키로 열림\n21:47 — 금고 중량 감소 / 원본 재고 0\n21:48 — 다시 잠김\n\n복도 외 다른 출입구는 없고, 이 시간에 나온 사람은 CCTV의 한 명뿐이다.'],['B-06 / 반출과 동기','아직 건물 안에 있다','21:40 — 감사팀이 원본 보존 요청 발송\n요청 사유: 윤서진의 과거 안전 경고 방송 삭제 지시 조사\n\n21:51 — 지하 선반 C에 빨간 상자 입고\n22:00 — 반출 게이트 봉쇄\n이후 반출 이력 없음.\n\n반출 상자별 상세 내용은 종이 운송 전표에만 남는다.']]
]};
let state={role:null,phase:0,notes:{A:'',B:''},read:{},won:false,feedback:null};try{const s=JSON.parse(localStorage.getItem('broadcast-v1'));if(s&&[null,'A','B'].includes(s.role)&&Number.isInteger(s.phase)&&s.phase>=0&&s.phase<=2)state={...state,...s};}catch(e){}
const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('broadcast-v1',JSON.stringify(state))}catch(e){}}
const artwork=`<div class="art" aria-hidden="true"><svg viewBox="0 0 440 360"><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#d6c9a8"/><stop offset="1" stop-color="#a29679"/></linearGradient></defs><g transform="translate(47 65) rotate(-8 160 120)"><rect width="320" height="220" rx="5" fill="url(#paper)"/><path d="M23 34h112M23 46h85M23 67h270" stroke="#736b54" stroke-width="2"/><text x="23" y="103" fill="#514a3b" font-family="monospace" font-size="15">ARCHIVE / ORIGINAL</text><text x="23" y="192" fill="#514a3b" font-family="monospace" font-size="12">LAST BROADCAST · 21:47</text></g><g transform="translate(105 131) rotate(9 133 70)"><rect width="270" height="158" rx="10" fill="#202925" stroke="#768371" stroke-width="2"/><rect x="14" y="13" width="242" height="103" rx="6" fill="#c0bfa3"/><text x="29" y="36" font-family="monospace" fill="#313c32" font-size="12">MASTER TAPE 01</text><rect x="32" y="50" width="206" height="49" rx="24" fill="#354238"/><circle cx="60" cy="74" r="18" fill="#d9d2b5"/><circle cx="210" cy="74" r="18" fill="#d9d2b5"/><circle cx="60" cy="74" r="9" fill="#26312a"/><circle cx="210" cy="74" r="9" fill="#26312a"/><path d="M80 127h109l21 27H61z" fill="#333f35"/><circle cx="85" cy="142" r="4" fill="#111916"/><circle cx="186" cy="142" r="4" fill="#111916"/></g></svg><div class="stamp">원본 소재 불명</div></div>`;
function home(){app.innerHTML=`<section class="hero"><div><div class="eyebrow">CO-OP MYSTERY · CASE 001</div><h1>마지막<br>송출</h1><p class="lead">목소리는 방송에 남았다.<br>그 사람도 그곳에 있었을까?</p><div class="tags"><span class="tag">2인 협동</span><span class="tag">예상 15~25분</span><span class="tag">증거 12개</span><span class="tag">무료 체험판</span></div><p>폐국을 한 시간 앞둔 라디오 방송국.<br>과거 사고의 진실이 담긴 원본 녹음이 사라졌다.<br>한 사람은 현장에, 다른 한 사람은 송출실에 있다.<br>각자의 증거를 맞춰 원본을 찾아야 한다.</p><button class="primary" id="start">사건 수사 시작하기 ↗</button></div>${artwork}</section><div class="introline"><div><strong>같은 사건. 서로 다른 증거.</strong><p>기자와 기술자의 정보를 말로 공유해 세 단계의 수사를 완료하세요.</p></div><div class="tiny">시간 제한 없음<br>이어하기 자동 저장 · 소리 없이 플레이</div></div><section id="roles"><div class="roles"><button class="role" data-role="A"><span>PLAYER A / 현장</span><h3>기자 · 서하</h3><p>증언, 현장 기록과 종이 자료를 조사합니다.</p><strong>A 역할로 시작 →</strong></button><button class="role" data-role="B"><span>PLAYER B / 송출실</span><h3>기술자 · 이안</h3><p>장비 기록과 송출 로그를 분석합니다.</p><strong>B 역할로 시작 →</strong></button></div><p class="help">체험판은 한 기기를 번갈아 사용하는 방식입니다. 상단의 ‘역할 바꾸기’로 화면을 넘기세요. 혼자 검수할 때는 두 역할을 모두 확인할 수 있습니다. 실시간 원격 동기화 기능은 없습니다.</p></section>`;document.getElementById('start').onclick=()=>document.getElementById('roles').scrollIntoView({behavior:'smooth'});document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{state.role=b.dataset.role;save();render();window.scrollTo(0,0)})}
const phaseNames=['시간을 되돌리다','목소리의 빈자리','사라진 원본'];
const missions=['CCTV에 사람이 나온 실제 시각은? 상대와 시계 기록을 대조하세요.','자료 보관함의 세 자리 암호는? 기호의 순서와 대응표를 합치세요.','범인, 방송 알리바이의 수법, 원본의 위치를 모두 확정하세요.'];
function game(){const r=state.role,p=state.phase;app.innerHTML=`<div class="sectiontitle"><div><div class="eyebrow">${r==='A'?'현장 조사 / 기자 서하':'송출실 조사 / 기술자 이안'}</div><h2>마지막 송출</h2></div><button id="swap">역할 바꾸기 ⇄</button></div><div class="meter"><i style="width:${(p+1)/3*100}%"></i></div><div class="workspace"><aside class="side"><div class="count">수사 진행 ${p+1} / 3 · 역할 ${r}</div>${phaseNames.map((n,i)=>`<button data-nav="${i}" ${i>p?'disabled':''} class="${i===p?'active':''}">${i+1}. ${n}${i>p?' 🔒':''}</button>`).join('')}<button id="brief">사건 개요</button></aside><section><div class="mission"><div class="eyebrow">현재 목표</div><p>${missions[p]}</p></div><div id="evidence"></div><div class="lock">${p<2?`<h3>${p===0?'첫 번째 결론 · 실제 시각':'자료 보관함 열기'}</h3><p>${p===0?'24시간제 네 자리로 입력하세요. 예: 09:05 → 0905':'왼쪽부터 읽은 세 자리 숫자를 입력하세요.'}</p><form id="codeForm" class="row"><input id="code" aria-label="${p===0?'실제 시각 네 자리':'보관함 암호 세 자리'}" inputmode="numeric" autocomplete="off" maxlength="${p===0?5:3}" placeholder="${p===0?'시각 4자리':'암호 3자리'}" required><button class="primary" type="submit">${p===0?'시간 확정':'잠금 해제'}</button></form><div id="status" class="status" role="status"></div>`:`<h3>최종 수사 보고서</h3><form id="finalForm"><label for="culprit">원본을 가져간 사람</label><select id="culprit" required><option value="">선택하세요</option><option value="yoon">윤서진 · 편성국장</option><option value="han">한도윤 · 음향기사</option><option value="min">민해수 · 기록 담당</option></select><label for="method">방송 중이었다는 알리바이의 실체</label><select id="method" required><option value="">선택하세요</option><option value="live">다른 방에서 생방송했다</option><option value="recording">리허설 녹음을 방송으로 재생했다</option><option value="clock">방송국의 모든 시계가 틀렸다</option></select><label for="location">원본을 찾아야 할 곳</label><select id="location" required><option value="">선택하세요</option><option value="tower">외부 송신탑 장비실</option><option value="desk">접수실 택배 보관대</option><option value="shelf">지하 선반 C의 빨간 운송 상자</option></select><button class="primary">수사 결론 제출</button><div id="status" class="status" role="status"></div></form>`}</div><details><summary>막혔나요? 첫 번째 힌트</summary><p>${['A의 CCTV 표시와 B의 시계 오차 기록을 비교하세요.','A는 기호의 순서를, B는 각 기호의 숫자를 가지고 있습니다.','목소리가 나갔다는 사실과 실제 마이크가 켜졌는지는 다릅니다.'][p]}</p><details><summary>한 단계 더 도움받기</summary><p>${['빠른 시계는 실제 시각보다 미래를 가리킵니다. 표시 시각에서 7분을 빼세요.','파도 → 종 → 새의 순서로 대응표를 읽으세요.','A-06으로 두 사람의 동선을 확인하고, B-04로 나머지 한 사람의 진술을 검증하세요. 원본의 위치는 A-05와 B-06을 합칩니다.'][p]}</p></details></details><div class="note"><h3>나의 수사 노트 <span class="count">역할별 저장</span></h3><textarea id="notes" aria-label="수사 노트" placeholder="상대가 알려준 사실과 의심되는 점을 적으세요.">${esc(state.notes[r]||'')}</textarea></div><button class="back" id="goHome">← 사건 첫 화면</button></section></div>`;
showEvidence(p);document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{showEvidence(Number(b.dataset.nav));document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x===b))});document.getElementById('swap').onclick=()=>document.getElementById('switch').showModal();document.getElementById('brief').onclick=()=>{document.getElementById('evidence').innerHTML='<article class="card"><h3>원본이 사라진 밤</h3><div class="body">22:00, 방송국의 모든 출입문과 반출 게이트가 봉쇄됐다. 21:30까지 금고에 있던 사고 당일의 원본 릴이 사라졌다. 현장 수사 범위의 용의자는 편성국장 윤서진, 음향기사 한도윤, 기록 담당 민해수 세 명이다.\n\n범인과 수법, 원본의 현재 위치를 확인해야 한다. 위의 단계 버튼으로 증거에 돌아갈 수 있다.</div></article>'};document.getElementById('notes').oninput=e=>{state.notes[r]=e.target.value;save()};document.getElementById('goHome').onclick=()=>{state.role=null;save();render()};if(p<2)document.getElementById('codeForm').onsubmit=e=>{e.preventDefault();const value=document.getElementById('code').value.replace(/[:\s]/g,'');if(value===(p===0?'2147':'731')){state.phase++;save();render();window.scrollTo(0,0)}else document.getElementById('status').textContent=p===0?'시각이 맞지 않습니다. CCTV 시계가 빠른지 느린지 다시 확인하세요.':'잠금이 풀리지 않습니다. 기호의 순서와 숫자를 다시 대조하세요.'};else document.getElementById('finalForm').onsubmit=e=>{e.preventDefault();if(document.getElementById('culprit').value==='yoon'&&document.getElementById('method').value==='recording'&&document.getElementById('location').value==='shelf'){state.won=true;save();render();window.scrollTo(0,0)}else document.getElementById('status').textContent='증거와 충돌하는 결론이 있습니다. 알리바이, 송출 로그, 운송 전표를 함께 확인하세요.'}}
function showEvidence(p){document.getElementById('evidence').innerHTML=`<div class="count" style="margin:12px 0">${p+1}단계 증거 · 역할 ${state.role}</div><div class="cards">${evidence[state.role][p].map(([id,title,body])=>`<article class="card"><div class="serial">${id}</div><h3>${title}</h3><div class="body">${esc(body)}</div><label><input type="checkbox" data-read="${id}" ${state.read[id]?'checked':''}> 상대에게 핵심 내용을 전달했어요</label></article>`).join('')}</div>`;document.querySelectorAll('[data-read]').forEach(c=>c.onchange=()=>{state.read[c.dataset.read]=c.checked;save()})}
function ending(){app.innerHTML=`<section class="end"><div class="eyebrow">CASE CLOSED / 사건 해결</div><h1>지워지지 않은<br>목소리</h1><p class="lead">빨간 상자의 뚜껑을 열자, “폐기용”이라는 라벨 아래 원본 릴이 모습을 드러냈다.</p><p>서하가 봉인을 확인하고 이안이 감사팀에 인계한다. 방송국의 마지막 송출은 끝났지만, 사라질 뻔한 목소리는 남았다.</p><div class="solution"><h3>두 사람의 증거가 만든 결론</h3><p><strong>21:47 — 실제 반출 시각.</strong><br>A-01의 CCTV 시각 21:54에서 B-01의 오차 7분을 뺀다. B-02의 복도 정전 시각과 일치한다.</p><p><strong>731 — 숨긴 전표에 도달하는 암호.</strong><br>A-03의 파도·종·새를 B-03의 숫자에 대응한다.</p><p><strong>윤서진 — 녹음으로 만든 알리바이.</strong><br>A-02의 생방송 진술은 B-04의 파일 재생 및 마이크 OFF 기록과 모순된다. A-06은 다른 두 사람의 연속된 동선을 확인한다. B-05의 금고 기록까지 함께 보면 원본을 가져간 사람은 윤서진이다.</p><p><strong>지하 선반 C — 원본 회수.</strong><br>A-05의 종이 전표가 실제 내용물을, B-06의 반출 기록이 현재 위치를 확인한다. 과거 삭제 지시에 대한 감사를 막으려던 윤서진은 원본을 폐기품으로 위장해 반출하려 했다.</p></div><h3>체험 후 한 가지 질문</h3><p>이런 방식의 더 긴 사건을 둘이 함께 플레이하고 싶나요?</p><div class="feedback">${['다음 사건도 해보고 싶다','더 어려웠으면 좋겠다','협동 요소가 더 필요하다'].map((x,i)=>`<button data-feedback="${i}" class="${state.feedback===i?'selected':''}">${x}</button>`).join('')}</div><p class="help" id="feedbackStatus">${state.feedback!==null?'선택을 이 기기에 저장했습니다. 외부로 전송되지 않습니다.':'응답은 이 기기에만 저장되며, 제작자에게 전송되지 않습니다.'}</p><div class="row"><button id="review">증거 다시 보기</button><button id="reset">처음부터 다시 하기</button></div><p class="help">현재 버전은 완결된 짧은 체험판입니다. 결제·회원가입·온라인 방 생성 기능은 포함하지 않습니다.</p></section>`;document.querySelectorAll('[data-feedback]').forEach(b=>b.onclick=()=>{state.feedback=Number(b.dataset.feedback);save();ending()});document.getElementById('review').onclick=()=>{state.won=false;if(!state.role)state.role='A';save();render()};document.getElementById('reset').onclick=()=>{if(confirm('수사 진행과 노트를 모두 지우고 다시 시작할까요?')){state={role:null,phase:0,notes:{A:'',B:''},read:{},won:false,feedback:null};save();render()}}}
function render(){if(state.won)ending();else if(state.role)game();else home()}
document.getElementById('cancelSwitch').onclick=()=>document.getElementById('switch').close();document.getElementById('confirmSwitch').onclick=()=>{state.role=state.role==='A'?'B':'A';save();document.getElementById('switch').close();render();window.scrollTo(0,0)};render();

</script></body></html>
