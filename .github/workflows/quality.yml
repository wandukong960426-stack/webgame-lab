name: Pull request quality

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  NEXT_PUBLIC_SITE_URL: https://ttanjitmoa.com

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Materialize staged source when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .upgrade ]; then
            cat .upgrade/part-* > /tmp/upgrade.b64
            base64 -d /tmp/upgrade.b64 > /tmp/upgrade.tar.gz
            echo "943078396a091d52fc8bae2d973074a62d8f52235d1771e6a138381be4872bd6  /tmp/upgrade.tar.gz" | sha256sum -c -
            tar -xzf /tmp/upgrade.tar.gz
            rm -rf .upgrade .github/workflows/bootstrap-upgrade.yml
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Smoke test rendered application
        shell: bash
        run: |
          set -euo pipefail
          PORT=3010 npm run start > /tmp/ddanjitmoa-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3010/ > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/ddanjitmoa-next.log
            exit 1
          fi

          SMOKE_BASE_URL=http://127.0.0.1:3010 npm run smoke
