name: Bootstrap verified upgrade

on:
  push:
    branches:
      - chatgpt/v2-game-upgrade
    paths:
      - .github/workflows/bootstrap-upgrade.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out upgrade branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reassemble and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .upgrade/part-* > /tmp/upgrade.b64
          base64 -d /tmp/upgrade.b64 > /tmp/upgrade.tar.gz
          echo "943078396a091d52fc8bae2d973074a62d8f52235d1771e6a138381be4872bd6  /tmp/upgrade.tar.gz" | sha256sum -c -
          tar -xzf /tmp/upgrade.tar.gz
          rm -rf .upgrade .github/workflows/bootstrap-upgrade.yml

      - name: Install exact dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit verified upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Launch 딴짓모아 multi-game upgrade"
          git push origin HEAD:chatgpt/v2-game-upgrade
