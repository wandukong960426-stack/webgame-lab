name: Production source audit

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Optional full Git commit SHA expected on ttanjitmoa.com"
        required: false
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRODUCTION_BASE_URL: https://ttanjitmoa.com
      EXPECTED_GIT_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit official domain
        run: npm run audit:production
