name: Materialize verified upgrade

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chatgpt/v2-game-upgrade'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out controlled upgrade branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Materialize checksum-verified source
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .upgrade ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat .upgrade/part-* > /tmp/upgrade.b64
          base64 -d /tmp/upgrade.b64 > /tmp/upgrade.tar.gz
          echo "943078396a091d52fc8bae2d973074a62d8f52235d1771e6a138381be4872bd6  /tmp/upgrade.tar.gz" | sha256sum -c -
          tar -xzf /tmp/upgrade.tar.gz
          rm -rf .upgrade .github/workflows/bootstrap-upgrade.yml
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit verified source
        if: steps.materialize.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Launch 딴짓모아 multi-game upgrade"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
