name: Materialize game platform source

on:
  push:
    branches:
      - feat/game-platform-v2

permissions:
  contents: write

jobs:
  materialize:
    if: contains(github.event.head_commit.message, '[materialize]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/game-platform-v2
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore verified source archive
        run: node .github/scripts/materialize.mjs
      - name: Commit restored source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: materialize six-game platform source [skip ci]"
          git push origin HEAD:feat/game-platform-v2
