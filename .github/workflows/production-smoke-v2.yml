name: Production smoke test v2

on:
  push:
    branches:
      - main
      - chore/production-smoke
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: read

concurrency:
  group: production-smoke-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      BASE_URL: https://ttanjitmoa.com
    steps:
      - name: Verify production pages, games, and SEO endpoints
        shell: bash
        run: |
          set -euo pipefail

          routes=(
            "/"
            "/games"
            "/games/omok"
            "/games/othello"
            "/games/2048"
            "/games/tic-tac-toe"
            "/games/chess"
            "/games/janggi"
            "/robots.txt"
            "/sitemap.xml"
          )

          healthy=0
          for attempt in $(seq 1 8); do
            failed=0
            echo "Smoke attempt ${attempt}/8"

            for route in "${routes[@]}"; do
              output="/tmp$(echo "$route" | tr '/' '_')"
              code=$(curl --compressed --location --silent --show-error \
                --connect-timeout 5 --max-time 15 \
                --output "$output" --write-out "%{http_code}" \
                "${BASE_URL}${route}?smoke=${GITHUB_RUN_ID}-${attempt}" || true)

              if [[ "$code" != "200" ]]; then
                echo "${route}: HTTP ${code:-request-failed}"
                failed=1
                break
              fi

              echo "${route}: HTTP 200"
            done

            if [[ "$failed" -eq 0 ]]; then
              healthy=1
              break
            fi

            sleep 10
          done

          if [[ "$healthy" -ne 1 ]]; then
            echo "Production did not become reachable within the retry window."
            exit 1
          fi

          grep -Fq "딴짓은 지금" /tmp_ || { echo "Home page is not the new release."; exit 1; }
          grep -Fq "틱택토+" /tmp_games || { echo "Game catalog is incomplete."; exit 1; }
          grep -Fq "/games/chess" /tmp_sitemap.xml || { echo "Sitemap is missing chess."; exit 1; }
          grep -Fq "Sitemap:" /tmp_robots.txt || { echo "robots.txt is missing the sitemap directive."; exit 1; }

          echo "Production smoke test passed."
